<a href="/auth/discord">
<button>
Discordでログイン
</button>
</a>

<p id="user"></p>

<script>

fetch("/api/user")
.then(r=>r.json())
.then(data=>{

if(data.logged){

document.getElementById("user").textContent =
data.user.username+"でログイン中";

}

});

</script>

<body>

<div id="game">

<h1>Cookie Battle</h1>

<div id="user"></div>


<div id="battle">

<img id="boss"
src="/assets/boss01.png">


<div>
HP:
<span id="bossHP">
1000
</span>
</div>


<img id="player"
src="/assets/player.png">


<button id="attack">
🏹 攻撃
</button>


</div>


</div>


<script src="game.js"></script>

</body>
