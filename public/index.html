<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Railway Map Editor</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="app-header">

    <div class="header-left">
        <div class="app-title">
            Railway Map Editor
        </div>

        <div class="app-subtitle">
            鉄道路線案内表エディタ
        </div>
    </div>

    <div class="header-right">

        <button
            id="saveButton"
            class="primary-button"
        >
            保存
        </button>

        <button
            id="newMapButton"
            class="secondary-button"
        >
            新規作成
        </button>

        <div
            id="userArea"
            class="user-area"
        ></div>

    </div>

</header>

<main class="app-main">

    <aside class="sidebar">

        <section class="panel">

            <div class="panel-title">
                路線図
            </div>

            <div class="field">

                <label for="mapName">
                    路線図名
                </label>

                <input
                    id="mapName"
                    type="text"
                    placeholder="例：神戸線案内表"
                >

            </div>

            <div class="button-row">

                <button
                    id="loadMapsButton"
                    class="secondary-button"
                >
                    保存済みを表示
                </button>

            </div>

            <div
                id="savedMaps"
                class="saved-maps"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                駅
            </div>

            <div class="field">

                <label for="stationName">
                    駅名
                </label>

                <input
                    id="stationName"
                    type="text"
                    placeholder="例：神戸三宮"
                >

            </div>

            <div class="field">

                <label for="stationRoman">
                    ローマ字
                </label>

                <input
                    id="stationRoman"
                    type="text"
                    placeholder="例：Kobe-Sannomiya"
                >

            </div>

            <div class="field">

                <label for="stationCode">
                    駅コード
                </label>

                <input
                    id="stationCode"
                    type="text"
                    placeholder="例：HK-16"
                >

            </div>

            <div class="field">

                <label for="stationTransfers">
                    乗換案内
                </label>

                <textarea
                    id="stationTransfers"
                    rows="4"
                    placeholder="1行につき1路線&#10;JR神戸線&#10;阪神本線&#10;神戸市営地下鉄"
                ></textarea>

            </div>

            <button
                id="addStationButton"
                class="primary-button full-width"
            >
                駅を追加
            </button>

            <div
                id="stationList"
                class="editor-list"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                路線
            </div>

            <div class="field">

                <label for="lineName">
                    路線名
                </label>

                <input
                    id="lineName"
                    type="text"
                    placeholder="例：神戸線"
                >

            </div>

            <div class="field">

                <label for="lineColor">
                    路線色
                </label>

                <input
                    id="lineColor"
                    type="color"
                    value="#0066cc"
                >

            </div>

            <button
                id="addLineButton"
                class="primary-button full-width"
            >
                路線を追加
            </button>

            <div
                id="lineList"
                class="editor-list"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                列車種別
            </div>

            <div class="field">

                <label for="trainTypeName">
                    種別名
                </label>

                <input
                    id="trainTypeName"
                    type="text"
                    placeholder="例：特急"
                >

            </div>

            <div class="field">

                <label for="trainTypeColor">
                    種別色
                </label>

                <input
                    id="trainTypeColor"
                    type="color"
                    value="#e60012"
                >

            </div>

            <button
                id="addTrainTypeButton"
                class="primary-button full-width"
            >
                種別を追加
            </button>

            <div
                id="trainTypeList"
                class="editor-list"
            ></div>

        </section>





    </aside>

    <section class="workspace">

        <div class="workspace-toolbar">

            <div class="toolbar-left">

                <button
                    id="zoomOutButton"
                    class="icon-button"
                    title="縮小"
                >
                    −
                </button>

                <button
                    id="zoomResetButton"
                    class="icon-button"
                    title="100%"
                >
                    100%
                </button>

                <button
                    id="zoomInButton"
                    class="icon-button"
                    title="拡大"
                >
                    ＋
                </button>

                <button id="addBendButton" class="secondary-button">折れ曲がりを追加</button>
                <button id="toggleBendPointsButton" class="secondary-button">折れ点：表示</button>

                <button
                    id="fitButton"
                    class="secondary-button"
                >
                    全体表示
                </button>

            </div>

            <div class="toolbar-right">

                <button id="undoButton" class="secondary-button">Undo</button>
                <button id="redoButton" class="secondary-button">Redo</button>
                <button
                    id="toggleGridButton"
                    class="secondary-button"
                >
                    グリッド：ON
                </button>

                <button
                    id="toggleDragModeButton"
                    class="secondary-button"
                >
                    駅移動：OFF
                </button>

            </div>

        </div>

        <div
            id="mapViewport"
            class="map-viewport"
        >

            <svg
                id="railwayMap"
                class="railway-map"
                viewBox="0 0 1600 1000"
                preserveAspectRatio="xMidYMid meet"
            >

                <defs>

                    <pattern
                        id="gridPattern"
                        width="40"
                        height="40"
                        patternUnits="userSpaceOnUse"
                    >

                        <path
                            d="M 40 0 L 0 0 0 40"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1"
                            opacity="0.08"
                        />

                    </pattern>

                </defs>

                <rect
                    id="mapBackground"
                    x="0"
                    y="0"
                    width="1600"
                    height="1000"
                    fill="transparent"
                />

                <rect
                    id="mapGrid"
                    x="0"
                    y="0"
                    width="1600"
                    height="1000"
                    fill="url(#gridPattern)"
                />

                <g id="lineLayer"></g>

                <g id="stationLayer"></g>

                <g id="selectionLayer"></g>

            </svg>

        </div>

        <div
            id="statusBar"
            class="status-bar"
        >
            準備完了
        </div>

    </section>

</main>

<div
    id="stationModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">

            <h2>
                駅の詳細設定
            </h2>

            <button
                id="closeStationModalButton"
                class="modal-close"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <input
                id="editingStationId"
                type="hidden"
            >

            <div class="field">

                <label>
                    駅名
                </label>

                <input
                    id="detailStationName"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    ローマ字
                </label>

                <input
                    id="detailStationRoman"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    駅コード
                </label>

                <input
                    id="detailStationCode"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    表示
                </label>

                <select id="detailStationVisible">

                    <option value="true">
                        表示
                    </option>

                    <option value="false">
                        非表示
                    </option>

                </select>

            </div>

            <hr>

            <h3>
                駅名表示
            </h3>

            <div class="field">

                <label>
                    文字方向
                </label>

                <select id="detailNameDirection">

                    <option value="vertical">
                        縦書き
                    </option>

                    <option value="horizontal">
                        横書き
                    </option>

                </select>

            </div>

            <div class="field">

                <label>
                    文字サイズ
                </label>

                <input
                    id="detailNameSize"
                    type="number"
                    min="6"
                    max="100"
                    value="18"
                >

            </div>

            <div class="field">

                <label>
                    回転
                </label>

                <input id="detailNameRotation" type="number" step="1" value="0">

            </div>

            <hr>

            <h3>
                ローマ字表示
            </h3>

            <div class="field">

                <label>
                    文字方向
                </label>

                <select id="detailRomanDirection">

                    <option value="horizontal">
                        横書き
                    </option>

                    <option value="vertical">
                        縦書き
                    </option>

                </select>

            </div>

            <div class="field">

                <label>
                    文字サイズ
                </label>

                <input
                    id="detailRomanSize"
                    type="number"
                    min="5"
                    max="80"
                    value="11"
                >

            </div>

            <div class="field">

                <label>
                    回転
                </label>

                <input id="detailRomanRotation" type="number" step="1" value="0">

            </div>

            <hr>

            <h3>
                駅の間隔
            </h3>

            <div class="field">

                <label>
                    前の駅からの距離
                </label>

                <input
                    id="detailSpacingBefore"
                    type="number"
                    min="20"
                    max="1000"
                    value="100"
                >

            </div>

            <div class="field">

                <label>
                    次の駅までの距離
                </label>

                <input
                    id="detailSpacingAfter"
                    type="number"
                    min="20"
                    max="1000"
                    value="100"
                >

            </div>

            <hr>

            <h3>
                駅BOX
            </h3>

            <div class="field">

                <label>
                    BOXサイズ
                </label>

                <select id="detailBoxMode">

                    <option value="auto">
                        自動
                    </option>

                    <option value="manual">
                        手動
                    </option>

                </select>

            </div>

            <div
                id="manualBoxSettings"
                class="hidden"
            >

                <div class="field">

                    <label>
                        幅
                    </label>

                    <input
                        id="detailBoxWidth"
                        type="number"
                        min="20"
                        max="500"
                        value="80"
                    >

                </div>

                <div class="field">

                    <label>
                        高さ
                    </label>

                    <input
                        id="detailBoxHeight"
                        type="number"
                        min="20"
                        max="500"
                        value="120"
                    >

                </div>

            </div>

            <hr>

            <h3>
                乗換案内
            </h3>

            <div class="field">

                <textarea
                    id="detailTransfers"
                    rows="5"
                    placeholder="1行につき1路線"
                ></textarea>

            </div>

        </div>

        <div class="modal-footer">

            <button
                id="deleteStationFromModalButton"
                class="danger-button"
            >
                駅を削除
            </button>

            <div class="modal-footer-right">

                <button
                    id="cancelStationModalButton"
                    class="secondary-button"
                >
                    キャンセル
                </button>

                <button
                    id="saveStationDetailButton"
                    class="primary-button"
                >
                    適用
                </button>

            </div>

        </div>

    </div>

</div>

<div
    id="lineModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">

            <h2>
                路線設定

            <button

        <div class="modal-body">

            <div class="field">

                </label>

                    id="detailLineName"

            <div class="field">

                <label>
                    路線色
                </label>

                <input
                    id="detailLineColor"

            </div>

            <hr>

            <h3>

            <div

</div>

        <div class="modal-footer">

            </button>

            <div class="modal-footer-right">

                <button
                    id="cancelLineModalButton"

                    キャンセル

                <button
                    id="saveLineDetailButton"

                </button>

    </div>

</div>

<div
    id="trainTypeModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">

            <h2>
                列車種別設定
            </h2>

            <button
                id="closeTrainTypeModalButton"
                class="modal-close"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <input
                id="editingTrainTypeId"
                type="hidden"
            >

            <div class="field">

                <label>
                    種別名
                </label>

                <input
                    id="detailTrainTypeName"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    種別色
                </label>

                <input
                    id="detailTrainTypeColor"
                    type="color"
                >

            </div>
<div class="field">

                <label>

                </label>

<div
    id="loginModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window login-window">

        <div class="modal-header">

            <h2>
                Discordログイン
            </h2>

            <button

<div
    id="toast"
    class="toast"
></div>

<script>

"use strict";

const state = {

    currentMapId: null,

    map: {

        name: "新しい路線図",

        stations: [],

        lines: [],

        trainTypes: [],

        breaks: []

    },

    selectedLineId: null,


    selectedStationId: null,

    zoom: 1,

    gridVisible: true,

    dragMode: false,

    draggingStation: null,

    dragOffsetX: 0,

    dragOffsetY: 0,
    dragViewportScrollLeft: 0,
    dragViewportScrollTop: 0,
      bendMode: false,
      bendPointerActive: false,
      bendPointsVisible: true,
      draggingText: null,
      inlineEditStationId: null,
      selectedBendSegmentId: null

};

const $ = id => document.getElementById(id);

const svg = $("railwayMap");
svg.style.touchAction = "pan-x pan-y";

const stationLayer = $("stationLayer");

const lineLayer = $("lineLayer");

const selectionLayer = $("selectionLayer");

function uid(prefix = "id") {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );

}

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}

function normalizeMapId(value) {
    if (value === null || value === undefined) return null;
    if (typeof value === "string" || typeof value === "number") return String(value);
    if (typeof value === "object") {
        if (value.$oid !== undefined) return String(value.$oid);
        if (value.id !== undefined) return String(value.id);
        if (value._id !== undefined) return normalizeMapId(value._id);
    }
    return null;
}

function normalizeMap() {

    if (!state.map) {

        state.map = {
            name: "新しい路線図",
            stations: [],
            lines: [],
            trainTypes: [],
            breaks: []
        };

    }

    if (!Array.isArray(state.map.stations)) {
        state.map.stations = [];
    }

    if (!Array.isArray(state.map.lines)) {
        state.map.lines = [];
    }

    if (!Array.isArray(state.map.trainTypes)) {
        state.map.trainTypes = [];
    }

    if (!Array.isArray(state.map.breaks)) {
        state.map.breaks = [];
    }

    for (const station of state.map.stations) {

        if (!station.id) {
            station.id = uid("station");
        }

        station.name ??= "";

        station.roman ??= "";

        station.code ??= "";

        station.x ??= 300;

        station.y ??= 300;

        station.visible ??= true;

        station.transfers ??= [];

        if (!Array.isArray(station.transfers)) {
            station.transfers = [];
        }

        station.display ??= {};

        station.display.nameSize ??= 18;

        station.display.romanSize ??= 11;

        station.display.nameDirection ??= "vertical";

        station.display.romanDirection ??= "vertical";

        station.display.nameRotation ??= 0;

        station.display.romanRotation ??= 0;
        station.display.nameVisible ??= true;
        station.display.romanVisible ??= true;
        station.display.nameOffsetX ??= 0;
        station.display.nameOffsetY ??= 0;
        station.display.romanOffsetX ??= 0;
        station.display.romanOffsetY ??= 0;

        station.display.boxMode ??= "auto";

        station.display.boxWidth ??= 80;

        station.display.boxHeight ??= 120;

        station.display.spacingBefore ??= 100;

        station.display.spacingAfter ??= 100;

    }

    for (const line of state.map.lines) {

        if (!line.id) {
            line.id = uid("line");
        }

        line.name ??= "路線";

        line.color ??= "#0066cc";

        line.stationIds ??= [];

        line.trainTypes ??= [];

        line.segments ??= [];
        // 旧形式の折れ点を列車種別ごとに分離して、同一駅間でも路線種別ごとに独立して曲げられるようにする。
        const legacySegments = line.segments.filter(segment => !segment.trainTypeId);
        if (legacySegments.length && line.trainTypes.length) {
            const typed = [];
            for (const segment of legacySegments) {
                for (const setting of line.trainTypes) {
                    typed.push({ ...segment, id: uid("segment"), trainTypeId: setting.trainTypeId, points: (segment.points || []).map(point => ({...point})) });
                }
            }
            line.segments = line.segments.filter(segment => segment.trainTypeId).concat(typed);
        }

    }

    for (const type of state.map.trainTypes) {

        if (!type.id) {
            type.id = uid("type");
        }

        type.name ??= "種別";

        type.color ??= "#e60012";

        type.lineLength ??= 1000;

        type.lineOffset ??= 0;

        type.lineWidth ??= 6.5;

    }

}

function getStation(id) {

    return state.map.stations.find(
        station => station.id === id
    );

}

function getLine(id) {

    return state.map.lines.find(
        line => line.id === id
    );

}

function getTrainType(id) {

    return state.map.trainTypes.find(
        type => type.id === id
    );

}

function svgPointFromEvent(event) {

    const rect = svg.getBoundingClientRect();

    const viewBox = svg.viewBox.baseVal;

    const x =
        (event.clientX - rect.left) /
        rect.width *
        viewBox.width;

    const y =
        (event.clientY - rect.top) /
        rect.height *
        viewBox.height;

    return {
        x,
        y
    };

}

function estimateTextWidth(text, size) {

    return Math.max(
        1,
        String(text || "").length
    ) * size * 0.95;

}

function getStationMultiplicity(station) {
    const routeCount = state.map.lines.filter(line => line.stationIds?.includes(station.id)).length;
    const typeKeys = new Set();
    for (const line of state.map.lines) {
        if (!line.stationIds?.includes(station.id)) continue;
        for (const setting of line.trainTypes || []) {
            if ((setting.stationIds || []).includes(station.id)) {
                typeKeys.add(`${line.id}:${setting.trainTypeId}`);
            }
        }
    }
    return { routeCount, typeCount: typeKeys.size, boxed: routeCount >= 2 || typeKeys.size >= 2 };
}

function getLineLaneGap(line, active) {
    const baseGap = Math.max(
        ...active.map(setting => {
            const type = getTrainType(setting.trainTypeId);
            return Math.max((Number(type?.lineWidth) || 6.5) + 8, 16);
        }),
        20
    );

    // 3種別以上では、駅BOXが別種別の線を跨がないだけの間隔を自動確保する。
    if (active.length >= 3) {
        let requiredGap = baseGap;
        for (const station of state.map.stations) {
            if (!station.visible) continue;
            const stopCount = active.filter(setting =>
                (setting.stationIds || []).includes(station.id)
            ).length;
            if (stopCount >= 2 && station.display?.boxMode !== "manual") {
                const nameSize = Number(station.display?.nameSize) || 18;
                const romanSize = Number(station.display?.romanSize) || 11;
                const name = station.name || "";
                const vertical = (station.display?.nameDirection || "vertical") === "vertical";
                const textHeight = vertical
                    ? Math.max(52, [...name].length * nameSize * 1.08 + 22)
                    : Math.max(42, nameSize + 18);
                requiredGap = Math.max(requiredGap, textHeight + romanSize + 24);
            }
        }
        return requiredGap;
    }

    return baseGap;
}

function getStationLaneContexts(station, includeAllActive = false) {
    const contexts = [];

    for (const line of state.map.lines) {
        const active = (line.trainTypes || [])
            .filter(setting => (setting.stationIds || []).length >= 2);

        if (!active.length) continue;

        const routeOrder = new Map(
            (line.stationIds || []).map((id, index) => [id, index])
        );
        const laneGap = getLineLaneGap(line, active);

        active.forEach((setting, typeIndex) => {
            const type = getTrainType(setting.trainTypeId);
            if (!type) return;

            const stopsHere = (setting.stationIds || []).includes(station.id);
            if (!includeAllActive && !stopsHere) return;

            const laneOffset =
                (Number(type.lineOffset) || 0) +
                ((active.length - 1 - typeIndex) - (active.length - 1) / 2) * laneGap;

            contexts.push({
                line,
                setting,
                type,
                typeIndex,
                activeCount: active.length,
                laneGap,
                laneOffset,
                y: station.y + laneOffset,
                stopsHere,
                routeOrder: routeOrder.get(station.id) ?? Infinity
            });
        });
    }

    return contexts;
}

function getStationLabelBaseY(station, stopContexts) {
    const allContexts = getStationLaneContexts(station, true);
    const activeCount = Math.max(
        0,
        ...allContexts.map(context => context.activeCount)
    );

    // 3種別以上で「真ん中の種別だけ停車」など、駅マーカーが中央レーンに
    // ある場合は、駅名を一番下の種別線より下へ逃がす。
    if (activeCount >= 3 && stopContexts.length === 1) {
        const bottomY = Math.max(
            station.y,
            ...allContexts.map(context => context.y)
        );
        const type = stopContexts[0].type;
        const nameSize = Number(station.display?.nameSize) || 18;
        const gap = Math.max(
            16,
            (Number(type?.lineWidth) || 6.5) + 10
        );
        return bottomY + gap + nameSize / 2;
    }

    if (stopContexts.length) {
        return stopContexts.reduce((sum, context) => sum + context.y, 0) / stopContexts.length;
    }

    return station.y;
}

function getHorizontalTextLines(text) {
    const chars = [...String(text || "")];
    const lines = [];
    for (let i = 0; i < chars.length; i += 2) {
        lines.push(chars.slice(i, i + 2).join(""));
    }
    return lines;
}

function getTextMetrics(text, size, direction) {
    if (direction === "vertical") {
        return {
            width: Math.max(size, size * 1.05),
            height: Math.max(size, [...String(text || "")].length * size * 1.08)
        };
    }
    const lines = getHorizontalTextLines(text);
    return {
        width: Math.max(size, ...lines.map(line => estimateTextWidth(line, size))),
        height: Math.max(size, lines.length * size * 1.12)
    };
}

function getStationBoxSize(station) {
    const display = station.display || {};
    const multiplicity = getStationMultiplicity(station);

    if (display.boxMode === "manual") {
        return {
            width: Math.max(20, Number(display.boxWidth) || 80),
            height: Math.max(20, Number(display.boxHeight) || 120)
        };
    }

    const nameSize = Number(display.nameSize) || 18;
    const romanSize = Number(display.romanSize) || 11;
    const name = station.name || "";
    const roman = station.roman || "";
    const nameDir = display.nameDirection || "vertical";
    const nameMetrics = getTextMetrics(name, nameSize, nameDir);
    const romanMetrics = getTextMetrics(roman, romanSize, "horizontal");

    // 駅名は横書きなら2文字ごとに自動改行。縦書きなら全文字を縦に積む。
    let width = nameMetrics.width + (roman ? romanMetrics.width + 18 : 12) + 20;
    let height = Math.max(42, nameMetrics.height + 22, romanMetrics.height + 18);

    if (multiplicity.boxed) {
        const stopContexts = getStationLaneContexts(station, false);
        const allContexts = getStationLaneContexts(station, true);

        // 複数種別が停車する駅は、停車する一番上～一番下の線を
        // ひとつの箱で完全に覆う。箱の中心もその範囲の中央へ合わせる。
        if (stopContexts.length >= 2) {
            const stopYs = stopContexts.map(c => c.y);
            const span = Math.max(...stopYs) - Math.min(...stopYs);
            height = Math.max(height, span + 18);
        }

        // 3種別以上で、停車線の間に非停車線がある場合でも、
        // 「停車する線を覆う」という条件を優先し、文字が切れないようにする。
        if (allContexts.length >= 3) {
            const stopYs = stopContexts.map(c => c.y);
            if (stopYs.length) {
                const stopSpan = Math.max(...stopYs) - Math.min(...stopYs);
                height = Math.max(height, stopSpan + 18);
            }
        }

        return {
            width: Math.max(58, width),
            height: Math.max(42, height)
        };
    }

    return {
        width: Math.max(70, width),
        height: Math.max(58, height)
    };
}

function createSvgElement(
    tag,
    attributes = {}
) {

    const element =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag
        );

    for (
        const [key, value]
        of Object.entries(attributes)
    ) {

        element.setAttribute(
            key,
            value
        );

    }

    return element;

}

function drawStationText(group, station) {
    const display = station.display || {};
    const box = getStationBoxSize(station);
    const cx = station.x;
    const name = station.name || "";
    const roman = station.roman || "";
    const nameSize = Number(display.nameSize) || 18;
    const romanSize = Number(display.romanSize) || 11;
    const nameDir = display.nameDirection || "vertical";
    const nameOX = Number(display.nameOffsetX) || 0;
    const nameOY = Number(display.nameOffsetY) || 0;
    const romanOX = Number(display.romanOffsetX) || 0;
    const romanOY = Number(display.romanOffsetY) || 0;
    const stopContexts = getStationLaneContexts(station, false);
    const large = getStationMultiplicity(station).boxed;

    function addTextGroup(textValue, direction, size, x, centerY, rotation, role) {
        if (!textValue) return;
        if (role === "name" && display.nameVisible === false) return;
        if (role === "roman" && display.romanVisible === false) return;

        const g = createSvgElement("g", {
            class: role === "name" ? "station-name-group" : "station-roman-group",
            transform: `rotate(${Number(rotation) || 0} ${x} ${centerY})`,
            "data-text-role": role
        });

        if (direction === "vertical") {
            const chars = [...textValue];
            const step = size * 1.08;
            const total = chars.length * step;
            let y = centerY - total / 2 + step / 2;
            for (const ch of chars) {
                const t = createSvgElement("text", {
                    x, y, "font-size": size, "text-anchor": "middle",
                    "dominant-baseline": "middle",
                    class: role === "name" ? "station-name" : "station-roman",
                    style: `font-size: ${size}px`
                });
                t.textContent = ch;
                g.appendChild(t);
                y += step;
            }
        } else {
            // 横書きは2文字ごとに自動改行して箱からのはみ出しを防ぐ。
            const lines = role === "name" ? getHorizontalTextLines(textValue) : [textValue];
            const step = size * 1.12;
            const total = lines.length * step;
            let y = centerY - total / 2 + step / 2;
            for (const line of lines) {
                const t = createSvgElement("text", {
                    x, y, "font-size": size, "text-anchor": "middle",
                    "dominant-baseline": "middle",
                    class: role === "name" ? "station-name" : "station-roman",
                    style: `font-size: ${size}px`
                });
                t.textContent = line;
                g.appendChild(t);
                y += step;
            }
        }
        group.appendChild(g);
    }

    const stopYs = stopContexts.map(c => c.y);
    const stopCenterY = stopYs.length
        ? (Math.min(...stopYs) + Math.max(...stopYs)) / 2
        : station.y;

    const nameMetrics = getTextMetrics(name, nameSize, nameDir);
    const romanMetrics = getTextMetrics(roman, romanSize, "horizontal");

    if (large) {
        // 日本語駅名とローマ字を横方向に並べる。ローマ字のサイズはromanSizeをそのまま使用。
        const nameX = cx - (roman ? (romanMetrics.width + 10) / 2 : 0) + nameOX;
        const romanX = cx + (nameMetrics.width + 10) / 2 + romanMetrics.width / 2 + romanOX;

        addTextGroup(name, nameDir, nameSize, nameX, stopCenterY + nameOY, display.nameRotation, "name");
        if (roman) {
            addTextGroup(roman, "horizontal", romanSize, romanX, stopCenterY + romanOY, display.romanRotation, "roman");
        }
        return;
    }

    const labelBaseY = getStationLabelBaseY(station, stopContexts);
    if (name && display.nameVisible !== false) {
        const nameCenterY = labelBaseY + nameOY + (nameDir === "vertical" ? nameMetrics.height / 2 - nameSize / 2 : 0);
        addTextGroup(name, nameDir, nameSize, cx + nameOX, nameCenterY, display.nameRotation, "name");

        if (roman && display.romanVisible !== false) {
            const romanX = cx + nameMetrics.width / 2 + romanMetrics.width / 2 + 10 + romanOX;
            addTextGroup(roman, "horizontal", romanSize, romanX, nameCenterY + romanOY, display.romanRotation, "roman");
        }
    } else if (roman && display.romanVisible !== false) {
        addTextGroup(roman, "horizontal", romanSize,
            cx + romanMetrics.width / 2 + 8 + romanOX,
            labelBaseY + romanSize / 2 + 8 + romanOY,
            display.romanRotation, "roman");
    }
}

function trainTypeStopsAt(
    line,
    trainTypeId,
    stationId
) {

    const setting =
        line.trainTypes.find(
            item =>
                item.trainTypeId ===
                trainTypeId
        );

    if (!setting) {
        return false;
    }

    return setting.stationIds
        .includes(stationId);

}

function getBendPoints(line, fromStationId, toStationId, trainTypeId) {
    const item = (line.segments || []).find(segment =>
        segment.fromStationId === fromStationId &&
        segment.toStationId === toStationId &&
        segment.trainTypeId === trainTypeId
    );
    return item?.points || [];
}

function distancePointToSegment(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy || 1;
    const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / len2, 0, 1);
    const q = { x: a.x + dx * t, y: a.y + dy * t };
    return { d2: (p.x - q.x) ** 2 + (p.y - q.y) ** 2, point: q };
}

function renderTrainTypeLine(line, trainType, typeIndex, activeTypeCount) {
    const setting = line.trainTypes.find(item => item.trainTypeId === trainType.id);
    if (!setting) return;
    const routeOrder = new Map((line.stationIds || []).map((id, index) => [id, index]));
    const stations = (setting.stationIds || [])
        .map(getStation)
        .filter(Boolean)
        .filter(station => station.visible)
        .sort((a, b) => (routeOrder.get(a.id) ?? Infinity) - (routeOrder.get(b.id) ?? Infinity));
    if (stations.length < 2) return;
    const width = Math.max(2, Number(trainType.lineWidth) || 6.5);
    const baseOffset = Number(trainType.lineOffset) || 0;
    const laneGap = getLineLaneGap(line, line.trainTypes.filter(item => (item.stationIds || []).length >= 2));
    const laneOffset = baseOffset + ((activeTypeCount - 1 - typeIndex) - (activeTypeCount - 1) / 2) * laneGap;

    for (let i = 0; i < stations.length - 1; i++) {
        const a = stations[i], b = stations[i + 1];
        const bend = getBendPoints(line, a.id, b.id, trainType.id);
        const points = [{ x: a.x, y: a.y + laneOffset }, ...bend.map(p => ({ x: p.x, y: p.y + laneOffset })), { x: b.x, y: b.y + laneOffset }];
        const polyline = createSvgElement("polyline", {
            points: points.map(p => `${p.x},${p.y}`).join(" "), fill: "none", stroke: trainType.color,
            "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round", class: "map-line"
        });
        lineLayer.appendChild(polyline);
        const hit = createSvgElement("polyline", {
            points: points.map(p => `${p.x},${p.y}`).join(" "), fill: "none", stroke: "transparent",
            "stroke-width": Math.max(18, width + 12), class: "map-line-hit"
        });
        hit.addEventListener("click", event => {
            event.stopPropagation();
            state.selectedLineId = line.id;
            updateLineList();
        });
        lineLayer.appendChild(hit);
    }
}

function renderTransferGuides(group, station, box) {
    const transfers = (station.transfers || [])
        .map(value => String(value || "").trim())
        .filter(Boolean);
    if (!transfers.length) return;

    // 駅の真下へ薄い縦線を伸ばし、その先に乗換先を横書きで並べる
    const bottomY = station.y + box.height / 2;
    const lineX = station.x;
    const lineStartY = bottomY + 2;
    const textX = station.x + 7;
    const textY = bottomY + 48;
    const rowGap = 15;

    group.appendChild(createSvgElement("path", {
        d: `M ${lineX} ${lineStartY} L ${lineX} ${textY - 7}`,
        fill: "none",
        stroke: "#aeb7c2",
        "stroke-width": 1,
        "stroke-linecap": "round",
        class: "station-transfer-line"
    }));

    transfers.forEach((label, index) => {
        const t = createSvgElement("text", {
            x: textX,
            y: textY + index * rowGap,
            "font-size": 10,
            "text-anchor": "start",
            "dominant-baseline": "middle",
            fill: "#929eaa",
            transform: `rotate(6 ${textX} ${textY + index * rowGap})`,
            class: "station-transfer"
        });
        t.textContent = label;
        group.appendChild(t);
    });
}

function applyStationSpacing(station) {
    const index = state.map.stations.findIndex(s => s.id === station.id);
    if (index < 0) return;
    const before = Number(station.display.spacingBefore) || 0;
    const after = Number(station.display.spacingAfter) || 0;
    if (index > 0) {
        const prev = state.map.stations[index - 1];
        station.x = prev.x + before;
    }
    if (index < state.map.stations.length - 1) {
        const next = state.map.stations[index + 1];
        next.x = station.x + after;
    }
}

function renderLineLayer() {
    lineLayer.innerHTML = "";
    for (const line of state.map.lines) {
        const active = (line.trainTypes || []).filter(setting => (setting.stationIds || []).length >= 2);
        active.forEach((setting, index) => {
            const type = getTrainType(setting.trainTypeId);
            if (type) renderTrainTypeLine(line, type, index, active.length);
        });

        // 折れ点は「路線＋種別＋区間」ごとに描画し、実際の種別線と同じオフセットへ置く。
        for (const segment of line.segments || []) {
            const typeIndex = active.findIndex(setting => setting.trainTypeId === segment.trainTypeId);
            if (typeIndex < 0) continue;
            const type = getTrainType(segment.trainTypeId);
            if (!type) continue;
            const laneGap = getLineLaneGap(line, active);
            const laneOffset = (Number(type.lineOffset) || 0) + ((active.length - 1 - typeIndex) - (active.length - 1) / 2) * laneGap;
            if (!state.bendPointsVisible) continue;
            (segment.points || []).forEach((point, pointIndex) => {
                const pointNode = createSvgElement("circle", {
                    cx: point.x, cy: point.y + laneOffset, r: 5, fill: "white", stroke: type.color || "#333", "stroke-width": 2.5, class: "bend-point",
                    "data-line-id": line.id, "data-train-type-id": segment.trainTypeId, "data-point-index": pointIndex
                });
                pointNode.style.pointerEvents = "all";
                pointNode.addEventListener("click", event => {
                    event.stopPropagation();
                    const currentLine = getLine(line.id);
                    const currentSegment = currentLine?.segments?.find(s => s.id === segment.id);
                    if (!currentSegment) return;
                    if (!confirm("この折れ点を削除しますか？")) return;
                    currentSegment.points.splice(pointIndex, 1);
                    if (!currentSegment.points.length) {
                        currentLine.segments = currentLine.segments.filter(s => s.id !== currentSegment.id);
                    }
                    renderMap();
                });
                lineLayer.appendChild(pointNode);
            });
        }
    }
}

function renderStation(station) {
    if (!station.visible) return;
    const group = createSvgElement("g", { class: "station-node station-group" });
    group.dataset.stationId = station.id;
    const box = getStationBoxSize(station);
    const multiplicity = getStationMultiplicity(station);
    const stopContexts = getStationLaneContexts(station, false);

    if (multiplicity.boxed) {
        const boxWidth = box.width;
        const boxHeight = box.height;
        const stopCenterY = stopContexts.length
            ? stopContexts.reduce((sum, context) => sum + context.y, 0) / stopContexts.length
            : station.y;

        group.appendChild(createSvgElement("rect", {
            x: station.x - boxWidth / 2,
            y: stopCenterY - boxHeight / 2,
            width: boxWidth,
            height: boxHeight,
            rx: 4,
            ry: 4,
            fill: "white",
            stroke: "#111",
            "stroke-width": 3,
            class: "station-large-box"
        }));

        // BOX駅では小駅用の丸を残さず、箱そのものが停車駅を表す。
        // 線は箱の下を通り、箱は停車する線の範囲を自動で覆う。
    } else {
        const markerY = stopContexts.length
            ? stopContexts[0].y
            : station.y;
        const markerColor = stopContexts[0]?.type?.color || "#111";
        group.appendChild(createSvgElement("circle", {
            cx: station.x,
            cy: markerY,
            r: 5,
            fill: "white",
            stroke: markerColor,
            "stroke-width": 2.5,
            class: "station-small-marker-circle"
        }));
    }
    drawStationText(group, station);
    renderTransferGuides(group, station, box);

    group.style.touchAction = "none";
    group.addEventListener("pointerdown", event => {
        if (event.target.closest?.("foreignObject")) return;
        if (state.bendMode || !state.dragMode) return;
        if (!event.target.matches?.("circle, rect")) return;
        event.preventDefault();
        event.stopPropagation();
        state.selectedStationId = station.id;
        const p = svgPointFromEvent(event);
        state.draggingStation = station;
        state.dragOffsetX = station.x - p.x;
        state.dragOffsetY = station.y - p.y;
        group.dataset.dragStartX = station.x;
        group.dataset.dragStartY = station.y;
        const viewport = $("mapViewport");
        state.dragViewportScrollLeft = viewport.scrollLeft;
        state.dragViewportScrollTop = viewport.scrollTop;
        group.setPointerCapture(event.pointerId);
    });
    group.addEventListener("pointermove", event => {
        if (state.draggingStation !== station) return;
        event.preventDefault();
        const viewport = $("mapViewport");
        viewport.scrollLeft = state.dragViewportScrollLeft;
        viewport.scrollTop = state.dragViewportScrollTop;
        const p = svgPointFromEvent(event);
        station.x = clamp(p.x + state.dragOffsetX, 20, 50000);
        station.y = clamp(p.y + state.dragOffsetY, 20, 980);
        renderLineLayer();
        const startX = Number(group.dataset.dragStartX);
        const startY = Number(group.dataset.dragStartY);
        group.setAttribute("transform", `translate(${station.x - startX} ${station.y - startY})`);
    });
    group.addEventListener("pointerup", event => {
        if (state.draggingStation === station) {
            state.draggingStation = null;
            try { group.releasePointerCapture(event.pointerId); } catch {}
            const viewport = $("mapViewport");
            viewport.scrollLeft = state.dragViewportScrollLeft;
            viewport.scrollTop = state.dragViewportScrollTop;
            renderMap();
        }
    });
    stationLayer.appendChild(group);
}

const history = { undo: [], redo: [], last: "", restoring: false };
function snapshotMap() { return JSON.stringify(state.map); }
function pushHistory() {
    if (history.restoring) return;
    const snap = snapshotMap();
    if (!history.last) {
        history.last = snap;
        return;
    }
    if (history.last === snap) return;
    history.undo.push(history.last);
    history.last = snap;
    history.redo.length = 0;
    projectDirty = true;
    updateHistoryButtons();
}
function updateHistoryButtons() {
    $("undoButton").disabled = history.undo.length === 0;
    $("redoButton").disabled = history.redo.length === 0;
}
function resetHistory() {
    history.undo.length = 0;
    history.redo.length = 0;
    history.last = snapshotMap();
    updateHistoryButtons();
}
$("undoButton").addEventListener("click", () => restoreHistory(history.undo, history.redo));
$("redoButton").addEventListener("click", () => restoreHistory(history.redo, history.undo));
function restoreHistory(from, to) {
    if (!from.length) return;
    const current = snapshotMap();
    to.push(current);
    history.restoring = true;
    try {
        state.map = JSON.parse(from.pop());
        history.last = snapshotMap();
        renderMap();
    } finally {
        history.restoring = false;
    }
    projectDirty = true;
    updateHistoryButtons();
}

function renderMap() {
    pushHistory();
    normalizeMap();
    stationLayer.innerHTML = "";
    selectionLayer.innerHTML = "";
    renderLineLayer();
    for (const station of state.map.stations) renderStation(station);
    updateLists();
    updateHistoryButtons();
}

function renderBreaks() {}

function appendStationInlineEditor(row, station) {
    if (state.inlineEditStationId !== station.id) return;
    const box = document.createElement("div");
    box.className = "station-list-inline-editor";

function renderLineModalStations(line) {
    const container = $("lineStationChecklist");
    container.innerHTML = "";
    for (const station of state.map.stations) {
        const item = document.createElement("div");
        item.className = "line-station-item";
        const label = document.createElement("label");
        label.className = "checkbox-row";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = line.stationIds.includes(station.id);
        checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
                if (!line.stationIds.includes(station.id)) line.stationIds.push(station.id);
            } else {
                line.stationIds = line.stationIds.filter(id => id !== station.id);
                for (const setting of line.trainTypes) setting.stationIds = setting.stationIds.filter(id => id !== station.id);
            }
            renderLineModalStations(line);
            renderMap();
        });
        label.appendChild(checkbox);
        const span = document.createElement("span");
        span.textContent = station.name;
        label.appendChild(span);
        item.appendChild(label);
        if (checkbox.checked && state.map.trainTypes.length) {
            const stopBox = document.createElement("div");
            stopBox.className = "station-stop-settings";
            for (const type of state.map.trainTypes) {
                const setting = ensureLineTrainTypeSetting(line, type.id);
                const typeLabel = document.createElement("label");
                typeLabel.className = "checkbox-row";
                const typeCheck = document.createElement("input");
                typeCheck.type = "checkbox";
                typeCheck.checked = setting.stationIds.includes(station.id);
                typeCheck.addEventListener("change", () => {
                    if (typeCheck.checked) {
                        if (!setting.stationIds.includes(station.id)) setting.stationIds.push(station.id);
                    } else {
                        setting.stationIds = setting.stationIds.filter(id => id !== station.id);
                    }
                    renderMap();
                });
                typeLabel.appendChild(typeCheck);
                const typeSpan = document.createElement("span");
                typeSpan.textContent = type.name;
                typeSpan.style.borderLeft = `5px solid ${type.color}`;
                typeSpan.style.paddingLeft = "8px";
                typeLabel.appendChild(typeSpan);
                stopBox.appendChild(typeLabel);
            }
            item.appendChild(stopBox);
        }
        container.appendChild(item);
    }
}

        state.bendPointerActive = false;
        $("addBendButton").textContent = state.bendMode ? "折れ曲がり：ON" : "折れ曲がりを追加";
        showToast(state.bendMode ? "折れ曲がり追加モード：ON" : "折れ曲がり追加モード：OFF");
    });

$("toggleBendPointsButton").addEventListener("click", () => {
    state.bendPointsVisible = !state.bendPointsVisible;
    $("toggleBendPointsButton").textContent =
        state.bendPointsVisible ? "折れ点：表示" : "折れ点：非表示";
    renderMap();
    showToast(
        state.bendPointsVisible
            ? "折れ点を表示しました"
            : "折れ点を非表示にしました"
    );
});

svg.addEventListener("pointerdown", event => {
    if (!state.bendMode || state.bendPointerActive) return;
    const line = getLine(state.selectedLineId);
    if (!line) { showToast("路線を選択してください"); return; }
    const p = svgPointFromEvent(event);
    const active = (line.trainTypes || []).filter(setting => (setting.stationIds || []).length >= 2);
    const candidates = [];

    active.forEach((setting, typeIndex) => {
        const type = getTrainType(setting.trainTypeId);
        if (!type) return;
        const routeOrder = new Map((line.stationIds || []).map((id, index) => [id, index]));
        const stations = (setting.stationIds || []).map(getStation).filter(Boolean).filter(s => s.visible)
            .sort((a,b) => (routeOrder.get(a.id) ?? Infinity) - (routeOrder.get(b.id) ?? Infinity));
        const laneGap = getLineLaneGap(line, active);
        const laneOffset = (Number(type.lineOffset) || 0) + ((active.length - 1 - typeIndex) - (active.length - 1) / 2) * laneGap;
        for (let i = 0; i < stations.length - 1; i++) {
            const a = stations[i], b = stations[i + 1];
            const bend = getBendPoints(line, a.id, b.id, type.id);
            const pts = [{x:a.x,y:a.y+laneOffset}, ...bend.map(q => ({x:q.x,y:q.y+laneOffset})), {x:b.x,y:b.y+laneOffset}];
            for (let j = 0; j < pts.length - 1; j++) {
                const hit = distancePointToSegment(p, pts[j], pts[j + 1]);
                candidates.push({ ...hit, fromId:a.id, toId:b.id, trainTypeId:type.id, typeIndex, laneOffset });
            }
        }
    });

    candidates.sort((a,b) => a.d2 - b.d2);
    const best = candidates[0];
    if (!best || best.d2 > 2500) { showToast("実際の路線線上をクリックしてください"); return; }

    let segment = (line.segments || []).find(s => s.fromStationId === best.fromId && s.toStationId === best.toId && s.trainTypeId === best.trainTypeId);
    if (!segment) {
        segment = { id: uid("segment"), trainTypeId: best.trainTypeId, fromStationId: best.fromId, toStationId: best.toId, points: [] };
        line.segments.push(segment);
    }
    const rawPoint = { x: best.point.x, y: best.point.y - best.laneOffset };
    if (!segment.points.some(point => Math.hypot(point.x - rawPoint.x, point.y - rawPoint.y) < 6)) {
        segment.points.push(rawPoint);
    }
    segment.points.sort((u,v) => {
        const a = getStation(segment.fromStationId), b = getStation(segment.toStationId);
        const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy || 1;
        return (((u.x-a.x)*dx+(u.y-a.y)*dy)/len2) - (((v.x-a.x)*dx+(v.y-a.y)*dy)/len2);
    });
    state.bendPointerActive = true;
    renderMap();
});

document.addEventListener("pointerup", () => {
    state.bendPointerActive = false;
    if (state.draggingStation) {
        state.draggingStation = null;
    }
});

function applyZoom() {
    const z = clamp(Number(state.zoom) || 1, 0.5, 3);
    state.zoom = Math.round(z * 10) / 10;
    svg.style.transform = "none";
    svg.style.width = `${1600 * state.zoom}px`;
    svg.style.height = `${1000 * state.zoom}px`;
    svg.style.minWidth = `${1600 * state.zoom}px`;
    svg.style.minHeight = `${1000 * state.zoom}px`;
    svg.style.transformOrigin = "top left";
    $("zoomResetButton").textContent = `${Math.round(state.zoom * 100)}%`;
}

function setZoom(next, center = false) {
    const viewport = $("mapViewport");
    const oldW = svg.getBoundingClientRect().width || 1600 * state.zoom;
    const oldH = svg.getBoundingClientRect().height || 1000 * state.zoom;
    const cx = viewport.scrollLeft + viewport.clientWidth / 2;
    const cy = viewport.scrollTop + viewport.clientHeight / 2;
    state.zoom = clamp(Math.round(next * 10) / 10, 0.5, 3);
    applyZoom();
    if (center) {
        const ratio = state.zoom / (oldW / 1600);
        viewport.scrollLeft = Math.max(0, cx * ratio - viewport.clientWidth / 2);
        viewport.scrollTop = Math.max(0, cy * ratio - viewport.clientHeight / 2);
    }
}
$("zoomInButton").addEventListener("click", () => setZoom(state.zoom + 0.1, true));
$("zoomOutButton").addEventListener("click", () => setZoom(state.zoom - 0.1, true));
$("zoomResetButton").addEventListener("click", () => setZoom(1, false));
$("fitButton").addEventListener("click", () => {
    const viewport = $("mapViewport");
    const xs = state.map.stations.filter(x => x.visible !== false).map(x => x.x);
    const ys = state.map.stations.filter(x => x.visible !== false).map(x => x.y);
    if (!xs.length) { setZoom(1, false); viewport.scrollLeft = viewport.scrollTop = 0; return; }
    const w = Math.max(...xs) - Math.min(...xs) + 180;
    const h = Math.max(...ys) - Math.min(...ys) + 180;
    setZoom(Math.min(1, (viewport.clientWidth - 40) / w, (viewport.clientHeight - 40) / h), false);
    viewport.scrollLeft = Math.max(0, (Math.min(...xs) - 80) * state.zoom);
    viewport.scrollTop = Math.max(0, (Math.min(...ys) - 80) * state.zoom);
});

let projectDirty = false;
window.addEventListener("beforeunload", event => {
    if (!projectDirty) return;
    event.preventDefault();
    event.returnValue = "編集中の内容は保存されていません。移動しますか？";
});

async function saveMap() {

    try {

        const userResponse =
            await fetch(
                "/api/user"
            );

        const userData =
            await userResponse.json();

        if (
            !userData ||
            !userData.user
        ) {

            $("loginModal")
                .classList.remove(
                    "hidden"
                );

            return;

        }

        state.map.name =
            $("mapName")
                .value
                .trim() ||
            "無題の路線図";

        const payload = {

            name:
                state.map.name,

            data:
                state.map

        };

        let response;

        if (state.currentMapId) {

            response =
                await fetch(
                    `/api/railway/maps/${state.currentMapId}`,
                    {
                        method:
                            "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        } else {

            response =
                await fetch(
                    "/api/railway/maps",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        }

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "保存に失敗しました"
            );

        }

        if (result.id) {

            state.currentMapId = normalizeMapId(result.id ?? result._id);

        }

        projectDirty = false;
        showToast(
            "路線図を保存しました"
        );

        await loadMapList();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "保存に失敗しました"
        );

    }

}

$("saveButton")
    .addEventListener(
        "click",
        saveMap
    );

$("closeLoginModalButton").addEventListener("click", () => {
    $("loginModal").classList.add("hidden");
});
$("loginModal").querySelector(".modal-backdrop").addEventListener("click", () => {
    $("loginModal").classList.add("hidden");
});

$("newMapButton")
    .addEventListener(
        "click",
        () => {

            if (
                !confirm(
                    "新しい路線図を作成しますか？"
                )
            ) {
                return;
            }

            state.currentMapId =
                null;

            state.map = {

                name:
                    "新しい路線図",

                stations: [],

                lines: [],

                trainTypes: [],

                breaks: []

            };

            state.selectedLineId = null;
            state.selectedStationId = null;

            $("mapName").value =
                state.map.name;

            resetHistory();
            renderMap();

        }
    );

async function loadMapList() {

    const container =
        $("savedMaps");

    container.innerHTML =
        "読み込み中…";

    try {

        const response =
            await fetch(
                "/api/railway/maps"
            );

        if (
            response.status ===
            401
        ) {

            container.innerHTML =
                "ログインすると保存済み路線図を表示できます。";

            return;

        }

        const result =
            await response.json();

        const maps =
            Array.isArray(result)
                ? result
                : result.maps || [];

        container.innerHTML =
            "";

        for (
            const map
            of maps
        ) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "saved-map-item";

            row.innerHTML = `

                <div>

                    <strong>
                        ${escapeHtml(
                            map.name
                        )}
                    </strong>

                    <small>
                        ${map.updatedAt
                            ? new Date(
                                map.updatedAt
                              ).toLocaleString(
                                "ja-JP"
                              )
                            : ""}
                    </small>

                </div>

                <div>

                    <button
                        class="small-button"
                        data-load
                    >
                        読込
                    </button>

                    <button
                        class="danger-small-button"
                        data-delete
                    >
                        削除
                    </button>

                </div>
            `;

            row.querySelector(
                "[data-load]"
            ).addEventListener(
                "click",
                () => {

                    loadMap(normalizeMapId(map._id ?? map.id));

                }
            );

            row.querySelector(
                "[data-delete]"
            ).addEventListener(
                "click",
                () => {

                    deleteMap(normalizeMapId(map._id ?? map.id));

                }
            );

            container.appendChild(
                row
            );

        }

    } catch (error) {

        console.error(error);

        container.textContent =
            "保存済み路線図を取得できませんでした。";

    }

}

$("loadMapsButton")
    .addEventListener(
        "click",
        loadMapList
    );

async function loadMap(
    id
) {
    id = normalizeMapId(id);
    if (!id) { showToast("保存データのIDを取得できませんでした"); return; }

    try {

        const response =
            await fetch(
                `/api/railway/maps/${encodeURIComponent(id)}`
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "読み込みに失敗しました"
            );

        }

        if (projectDirty && !confirm("編集中の内容は保存されていません。読み込みますか？")) return;
        state.currentMapId = normalizeMapId(result.id ?? result._id) || id;
        projectDirty = false;

        state.map =
            result.data ||
            result;

        normalizeMap();

        $("mapName").value =
            state.map.name ||
            result.name ||
            "無題の路線図";

        resetHistory();
        renderMap();

        showToast(
            "路線図を読み込みました"
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "読み込みに失敗しました"
        );

    }

}

async function deleteMap(
    id
) {
    id = normalizeMapId(id);
    if (!id) { showToast("保存データのIDを取得できませんでした"); return; }

    if (
        !confirm(
            "この路線図を削除しますか？"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/railway/maps/${encodeURIComponent(id)}`,
                {
                    method:
                        "DELETE"
                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "削除に失敗しました"
            );

        }

        if (
            state.currentMapId ===
            id
        ) {

            state.currentMapId =
                null;

        }

        await loadMapList();

        showToast(
            "削除しました"
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "削除に失敗しました"
        );

    }

}

async function loadUser() {

    try {

        const response =
            await fetch(
                "/api/user"
            );

        const result =
            await response.json();

        const userArea =
            $("userArea");

        if (
            result &&
            result.user
        ) {

            const user =
                result.user;

            let avatar =
                "";

            if (
                user.avatar &&
                user.discordId
            ) {

                avatar =
                    `https://cdn.discordapp.com/avatars/${user.discordId}/${user.avatar}.png?size=64`;

            }

            userArea.innerHTML = `

                ${
                    avatar
                        ? `
                            <img
                                class="user-avatar"
                                src="${avatar}"
                                alt=""
                            >
                          `
                        : ""
                }

                <span>
                    ${escapeHtml(
                        user.username ||
                        "Discord User"
                    )}
                </span>

                <a
                    href="/logout"
                    class="logout-link"
                >
                    ログアウト
                </a>

            `;

            loadMapList();

        } else {

            userArea.innerHTML = `

                <a
                    href="/auth/discord"
                    class="login-link"
                >
                    Discordでログイン
                </a>

            `;

        }

    } catch (error) {

        console.error(
            "User load error:",
            error
        );

    }

}

document.addEventListener(
    "keydown",
    event => {

        if (
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            event.key.toLowerCase() ===
                "s"
        ) {

            event.preventDefault();

            saveMap();

        }

        if (
            event.key ===
            "Escape"
        ) {

            closeStationModal();

            closeLineModal();

            closeTrainTypeModal();

        }

    }
);

$("mapName")
    .addEventListener(
        "input",
        event => {

            state.map.name =
                event.target.value;

        }
    );

normalizeMap();
$("mapViewport").classList.toggle("grid-off", !state.gridVisible);

$("mapName").value =
    state.map.name;

resetHistory();
renderMap();

loadUser();

</script>
