   GRID
========================================================= */

$("toggleGridButton")
    .addEventListener(
        "click",
        () => {

            state.gridVisible =
                !state.gridVisible;


            $("mapGrid")
                .style.display =
                state.gridVisible
                    ? ""
                    : "none";

        }
    );


/* =========================================================
   DRAG MODE
========================================================= */

$("toggleDragModeButton")
    .addEventListener(
        "click",
        () => {

            state.dragMode =
                !state.dragMode;


            $("toggleDragModeButton")
                .textContent =
                state.dragMode
                    ? "駅移動：ON"
                    : "駅移動：OFF";

        }
    );


/* =========================================================
   BREAK
========================================================= */

$("addBreakButton")
    .addEventListener(
        "click",
        () => {

            state.map.breaks.push({

                id:
                    uid("break"),

                points: [

                    {
                        x: 300,
                        y: 200
                    },

                    {
                        x: 500,
                        y: 300
                    }

                ]

            });


            renderMap();

        }
    );


$("addBendButton")
    .addEventListener(
        "click",
        () => {

            state.bendMode = !state.bendMode;

            $("addBendButton").textContent =
                state.bendMode
                    ? "折れ点追加：ON"
                    : "折れ曲がりを追加";

            showToast(
                state.bendMode
                    ? "折れ点を追加する位置をクリックしてください"
                    : "折れ点追加モードを終了しました"
            );

        }
    );


svg.addEventListener("pointerdown", event => {

    if (!state.bendMode || state.bendPointerActive) {
        return;
    }

    if (event.target.closest(".station-node")) {
        return;
    }

    state.bendPointerActive = true;

    const point = svgPointFromEvent(event);
    const line = getLine(state.selectedLineId);

    if (line) {

        line.segments ??= [];

        line.segments.push({
            id: uid("segment"),
            points: [point]
        });

        renderMap();

    }

});

svg.addEventListener("pointerup", () => {
    state.bendPointerActive = false;
});

/* =========================================================
   ZOOM
========================================================= */

function applyZoom() {

    svg.style.transform =
        `scale(${state.zoom})`;

}


$("zoomInButton")
    .addEventListener(
        "click",
        () => {

            state.zoom =
                Math.min(
                    2,
                    state.zoom + 0.1
                );

            applyZoom();

        }
    );


$("zoomOutButton")
    .addEventListener(
        "click",
        () => {

            state.zoom =
                Math.max(
                    0.5,
                    state.zoom - 0.1
                );

            applyZoom();

        }
    );


$("zoomResetButton")
    .addEventListener(
        "click",
        () => {

            state.zoom =
                1;

            applyZoom();

        }
    );


$("fitButton")
    .addEventListener(
        "click",
        () => {

            state.zoom =
                1;

            applyZoom();

        }
    );


/* =========================================================
   SAVE
========================================================= */

async function saveMap() {

    try {

        const userResponse =
            await fetch(
                "/api/user"
            );


        const userData =
            await userResponse.json();


        if (
            !userData ||
            !userData.user
        ) {

            $("loginModal")
                .classList.remove(
                    "hidden"
                );

            return;

        }


        state.map.name =
            $("mapName")
                .value
                .trim() ||
            "無題の路線図";


        const payload = {

            name:
                state.map.name,

            data:
                state.map

        };


        let response;


        if (state.currentMapId) {

            response =
                await fetch(
                    `/api/railway/maps/${state.currentMapId}`,
                    {
                        method:
                            "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        } else {

            response =
                await fetch(
                    "/api/railway/maps",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        }


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "保存に失敗しました"
            );

        }


        const savedMapId = normalizeMapId(
            result.id ??
            result._id ??
            result.mapId
        );

        if (savedMapId) {
            state.currentMapId = savedMapId;
        }


        showToast(
            "路線図を保存しました"
        );


        await loadMapList();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "保存に失敗しました"
        );

    }

}


$("saveButton")
    .addEventListener(
        "click",
        saveMap
    );


/* =========================================================
   NEW MAP
========================================================= */

$("newMapButton")
    .addEventListener(
        "click",
        () => {

            if (
                !confirm(
                    "新しい路線図を作成しますか？"
                )
            ) {
                return;
            }


            state.currentMapId =
                null;


            state.map = {

                name:
                    "新しい路線図",

                stations: [],

                lines: [],

                trainTypes: [],

                breaks: []

            };


            state.selectedLineId =
                null;

            state.selectedTrainTypeId =
                null;

            state.selectedStationId =
                null;


            $("mapName").value =
                state.map.name;


            renderMap();

        }
    );


/* =========================================================
   LOAD MAP LIST
========================================================= */
function normalizeMapId(value) {

    if (value === null || value === undefined) {
        return "";
    }

    if (typeof value === "object") {
        return String(value.$oid || value.id || value._id || "");
    }

    return String(value).trim();

}


async function loadMapList() {

    const container =
        $("savedMaps");

    container.innerHTML =
        "読み込み中…";


    try {

        const response =
            await fetch(
                "/api/railway/maps"
            );


        if (
            response.status ===
            401
        ) {

            container.innerHTML =
                "ログインすると保存済み路線図を表示できます。";

            return;

        }


        const result =
            await response.json();


        const maps =
            Array.isArray(result)
                ? result
                : result.maps || [];


        container.innerHTML =
            "";


        for (
            const map
            of maps
        ) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "saved-map-item";


            row.innerHTML = `

                <div>

                    <strong>
                        ${escapeHtml(
                            map.name
                        )}
                    </strong>

                    <small>
                        ${map.updatedAt
                            ? new Date(
                                map.updatedAt
                              ).toLocaleString(
                                "ja-JP"
                              )
                            : ""}
                    </small>

                </div>

                <div>

                    <button
                        class="small-button"
                        data-load
                    >
                        読込
                    </button>

                    <button
                        class="danger-small-button"
                        data-delete
                    >
                        削除
                    </button>

                </div>
            `;


            row.querySelector(
                "[data-load]"
            ).addEventListener(
                "click",
                () => {

                    const mapId = normalizeMapId(
                        map._id ??
                        map.id ??
                        map.mapId
                    );

                    if (!mapId) {
                        showToast("保存データのIDを取得できませんでした");
                        return;
                    }

                    loadMap(mapId);

                }
            );


            row.querySelector(
                "[data-delete]"
            ).addEventListener(
                "click",
                () => {

                    const mapId = normalizeMapId(
                        map._id ??
                        map.id ??
                        map.mapId
                    );

                    if (!mapId) {
                        showToast("保存データのIDを取得できませんでした");
                        return;
                    }

                    deleteMap(mapId);

                }
            );


            container.appendChild(
                row
            );

        }

    } catch (error) {

        console.error(error);

        container.textContent =
            "保存済み路線図を取得できませんでした。";

    }

}


$("loadMapsButton")
    .addEventListener(
        "click",
        loadMapList
    );


/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(
    id
) {

    id = normalizeMapId(id);

    if (!id) {
        showToast("保存データのIDを取得できませんでした");
        return;
    }

    try {

        const response =
            await fetch(
                `/api/railway/maps/${id}`
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "読み込みに失敗しました"
            );

        }


        state.currentMapId =
            normalizeMapId(
                result.id ??
                result._id ??
                result.mapId
            ) ||
            id;


        state.map =
            result.data ||
            result;


        normalizeMap();


        $("mapName").value =
            state.map.name ||
            result.name ||
            "無題の路線図";


        renderMap();


        showToast(
            "路線図を読み込みました"
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "読み込みに失敗しました"
        );

    }

}


/* =========================================================
   DELETE MAP
========================================================= */

async function deleteMap(
    id
) {

    id = normalizeMapId(id);

    if (!id) {
        showToast("保存データのIDを取得できませんでした");
        return;
    }

    if (
        !confirm(
            "この路線図を削除しますか？"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/railway/maps/${id}`,
                {
                    method:
                        "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "削除に失敗しました"
            );

        }


        if (
            state.currentMapId ===
            id
        ) {

            state.currentMapId =
                null;

        }


        await loadMapList();


        showToast(
            "削除しました"
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "削除に失敗しました"
        );

    }

}


/* =========================================================
   USER
========================================================= */

async function loadUser() {

    try {

        const response =
            await fetch(
                "/api/user"
            );


        const result =
            await response.json();


        const userArea =
            $("userArea");


        if (
            result &&
            result.user
        ) {

            const user =
                result.user;


            let avatar =
                "";


            if (
                user.avatar &&
                user.discordId
            ) {

                avatar =
                    `https://cdn.discordapp.com/avatars/${user.discordId}/${user.avatar}.png?size=64`;

            }


            userArea.innerHTML = `

                ${
                    avatar
                        ? `
                            <img
                                class="user-avatar"
                                src="${avatar}"
                                alt=""
                            >
                          `
                        : ""
                }

                <span>
                    ${escapeHtml(
                        user.username ||
                        "Discord User"
                    )}
                </span>

                <a
                    href="/logout"
                    class="logout-link"
                >
                    ログアウト
                </a>

            `;


            loadMapList();

        } else {

            userArea.innerHTML = `

                <a
                    href="/auth/discord"
                    class="login-link"
                >
                    Discordでログイン
                </a>

            `;

        }

    } catch (error) {

        console.error(
            "User load error:",
            error
        );

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            event.key.toLowerCase() ===
                "s"
        ) {

            event.preventDefault();

            saveMap();

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeStationModal();

            closeLineModal();

            closeTrainTypeModal();

        }

    }
);


/* =========================================================
   MAP NAME
========================================================= */

$("mapName")
    .addEventListener(
        "input",
        event => {

            state.map.name =
                event.target.value;

        }
    );


/* =========================================================
   INIT
========================================================= */

normalizeMap();

$("mapName").value =
    state.map.name;

renderMap();

loadUser();

</script>
