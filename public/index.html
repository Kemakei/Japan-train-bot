<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Railway Map Editor</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="app-header">

    <div class="header-left">
        <div class="app-title">
            Railway Map Editor
        </div>

        <div class="app-subtitle">
            鉄道路線案内表エディタ
        </div>
    </div>

    <div class="header-right">

        <button
            id="saveButton"
            class="primary-button"
        >
            保存
        </button>

        <button
            id="newMapButton"
            class="secondary-button"
        >
            新規作成
        </button>

        <div
            id="userArea"
            class="user-area"
        ></div>

    </div>

</header>

<main class="app-main">

    <aside class="sidebar">

        <section class="panel">

            <div class="panel-title">
                路線図
            </div>

            <div class="field">

                <label for="mapName">
                    路線図名
                </label>

                <input
                    id="mapName"
                    type="text"
                    placeholder="例：神戸線案内表"
                >

            </div>

            <div class="button-row">

                <button
                    id="loadMapsButton"
                    class="secondary-button"
                >
                    保存済みを表示
                </button>

            </div>

            <div
                id="savedMaps"
                class="saved-maps"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                駅
            </div>

            <div class="field">

                <label for="stationName">
                    駅名
                </label>

                <input
                    id="stationName"
                    type="text"
                    placeholder="例：神戸三宮"
                >

            </div>

            <div class="field">

                <label for="stationRoman">
                    ローマ字
                </label>

                <input
                    id="stationRoman"
                    type="text"
                    placeholder="例：Kobe-Sannomiya"
                >

            </div>

            <div class="field">

                <label for="stationCode">
                    駅コード
                </label>

                <input
                    id="stationCode"
                    type="text"
                    placeholder="例：HK-16"
                >

            </div>

            <div class="field">

                <label for="stationTransfers">
                    乗換案内
                </label>

                <textarea
                    id="stationTransfers"
                    rows="4"
                    placeholder="1行につき1路線&#10;JR神戸線&#10;阪神本線&#10;神戸市営地下鉄"
                ></textarea>

            </div>

            <button
                id="addStationButton"
                class="primary-button full-width"
            >
                駅を追加
            </button>

            <div
                id="stationList"
                class="editor-list"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                路線
            </div>

            <div class="field">

                <label for="lineName">
                    路線名
                </label>

                <input
                    id="lineName"
                    type="text"
                    placeholder="例：神戸線"
                >

            </div>

            <div class="field">

                <label for="lineColor">
                    路線色
                </label>

                <input
                    id="lineColor"
                    type="color"
                    value="#0066cc"
                >

            </div>

            <button
                id="addLineButton"
                class="primary-button full-width"
            >
                路線を追加
            </button>

            <div
                id="lineList"
                class="editor-list"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                列車種別
            </div>

            <div class="field">

                <label for="trainTypeName">
                    種別名
                </label>

                <input
                    id="trainTypeName"
                    type="text"
                    placeholder="例：特急"
                >

            </div>

            <div class="field">

                <label for="trainTypeColor">
                    種別色
                </label>

                <input
                    id="trainTypeColor"
                    type="color"
                    value="#e60012"
                >

            </div>

            <button
                id="addTrainTypeButton"
                class="primary-button full-width"
            >
                種別を追加
            </button>

            <div
                id="trainTypeList"
                class="editor-list"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                選択中の路線・種別
            </div>

            <div class="field">

                <label for="selectedLine">
                    路線
                </label>

                <select id="selectedLine">
                    <option value="">
                        路線を選択
                    </option>
                </select>

            </div>

            <div class="field">

                <label for="selectedTrainType">
                    列車種別
                </label>

                <select id="selectedTrainType">
                    <option value="">
                        種別を選択
                    </option>
                </select>

            </div>

            <div
                id="lineStationEditor"
                class="line-station-editor"
            ></div>

        </section>

        <section class="panel">

            <div class="panel-title">
                表示設定
            </div>

            <div class="button-row">
<button
                    id="addBendButton"
                    class="secondary-button"
                >
                    折れ曲がりを追加
                </button>

            </div>

        </section>

    </aside>

    <section class="workspace">

        <div class="workspace-toolbar">

            <div class="toolbar-left">

                <button
                    id="zoomOutButton"
                    class="icon-button"
                    title="縮小"
                >
                    −
                </button>

                <button
                    id="zoomResetButton"
                    class="icon-button"
                    title="100%"
                >
                    100%
                </button>

                <button
                    id="zoomInButton"
                    class="icon-button"
                    title="拡大"
                >
                    ＋
                </button>

                <button
                    id="fitButton"
                    class="secondary-button"
                >
                    全体表示
                </button>

            </div>

            <div class="toolbar-right">

                <button
                    id="toggleGridButton"
                    class="secondary-button"
                >
                    グリッド
                </button>

                <button
                    id="toggleDragModeButton"
                    class="secondary-button"
                >
                    駅移動
                </button>

            </div>

        </div>

        <div
            id="mapViewport"
            class="map-viewport"
        >

            <svg
                id="railwayMap"
                class="railway-map"
                viewBox="0 0 1600 1000"
                preserveAspectRatio="xMidYMid meet"
            >

                <defs>

                    <pattern
                        id="gridPattern"
                        width="40"
                        height="40"
                        patternUnits="userSpaceOnUse"
                    >

                        <path
                            d="M 40 0 L 0 0 0 40"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1"
                            opacity="0.08"
                        />

                    </pattern>

                </defs>

                <rect
                    id="mapBackground"
                    x="0"
                    y="0"
                    width="1600"
                    height="1000"
                    fill="transparent"
                />

                <rect
                    id="mapGrid"
                    x="0"
                    y="0"
                    width="1600"
                    height="1000"
                    fill="url(#gridPattern)"
                />

                <g id="lineLayer"></g>

                <g id="stationLayer"></g>

                <g id="selectionLayer"></g>

            </svg>

        </div>

        <div
            id="statusBar"
            class="status-bar"
        >
            準備完了
        </div>

    </section>

</main>

<div
    id="stationModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">

            <h2>
                駅の詳細設定
            </h2>

            <button
                id="closeStationModalButton"
                class="modal-close"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <input
                id="editingStationId"
                type="hidden"
            >

            <div class="field">

                <label>
                    駅名
                </label>

                <input
                    id="detailStationName"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    ローマ字
                </label>

                <input
                    id="detailStationRoman"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    駅コード
                </label>

                <input
                    id="detailStationCode"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    表示
                </label>

                <select id="detailStationVisible">

                    <option value="true">
                        表示
                    </option>

                    <option value="false">
                        非表示
                    </option>

                </select>

            </div>

            <hr>

            <h3>
                駅名表示
            </h3>

            <div class="field">

                <label>
                    文字方向
                </label>

                <select id="detailNameDirection">

                    <option value="vertical">
                        縦書き
                    </option>

                    <option value="horizontal">
                        横書き
                    </option>

                </select>

            </div>

            <div class="field">

                <label>
                    文字サイズ
                </label>

                <input
                    id="detailNameSize"
                    type="number"
                    min="6"
                    max="100"
                    value="18"
                >

            </div>

            <div class="field">

                <label>
                    回転
                </label>

                <input id="detailNameRotation" type="number" step="1" value="0">

            </div>

            <hr>

            <h3>
                ローマ字表示
            </h3>

            <div class="field">

                <label>
                    文字方向
                </label>

                <select id="detailRomanDirection">

                    <option value="horizontal">
                        横書き
                    </option>

                    <option value="vertical">
                        縦書き
                    </option>

                </select>

            </div>

            <div class="field">

                <label>
                    文字サイズ
                </label>

                <input
                    id="detailRomanSize"
                    type="number"
                    min="5"
                    max="80"
                    value="11"
                >

            </div>

            <div class="field">

                <label>
                    回転
                </label>

                <input id="detailRomanRotation" type="number" step="1" value="0">

            </div>

            <hr>

            <h3>
                駅の間隔
            </h3>

            <div class="field">

                <label>
                    前の駅からの距離
                </label>

                <input
                    id="detailSpacingBefore"
                    type="number"
                    min="20"
                    max="1000"
                    value="100"
                >

            </div>

            <div class="field">

                <label>
                    次の駅までの距離
                </label>

                <input
                    id="detailSpacingAfter"
                    type="number"
                    min="20"
                    max="1000"
                    value="100"
                >

            </div>

            <hr>

            <h3>
                駅BOX
            </h3>

            <div class="field">

                <label>
                    BOXサイズ
                </label>

                <select id="detailBoxMode">

                    <option value="auto">
                        自動
                    </option>

                    <option value="manual">
                        手動
                    </option>

                </select>

            </div>

            <div
                id="manualBoxSettings"
                class="hidden"
            >

                <div class="field">

                    <label>
                        幅
                    </label>

                    <input
                        id="detailBoxWidth"
                        type="number"
                        min="20"
                        max="500"
                        value="80"
                    >

                </div>

                <div class="field">

                    <label>
                        高さ
                    </label>

                    <input
                        id="detailBoxHeight"
                        type="number"
                        min="20"
                        max="500"
                        value="120"
                    >

                </div>

            </div>

            <hr>

            <h3>
                乗換案内
            </h3>

            <div class="field">

                <textarea
                    id="detailTransfers"
                    rows="5"
                    placeholder="1行につき1路線"
                ></textarea>

            </div>

        </div>

        <div class="modal-footer">

            <button
                id="deleteStationFromModalButton"
                class="danger-button"
            >
                駅を削除
            </button>

            <div class="modal-footer-right">

                <button
                    id="cancelStationModalButton"
                    class="secondary-button"
                >
                    キャンセル
                </button>

                <button
                    id="saveStationDetailButton"
                    class="primary-button"
                >
                    適用
                </button>

            </div>

        </div>

    </div>

</div>

<div
    id="lineModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">

            <h2>
                路線設定
            </h2>

            <button
                id="closeLineModalButton"
                class="modal-close"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <input
                id="editingLineId"
                type="hidden"
            >

            <div class="field">

                <label>
                    路線名
                </label>

                <input
                    id="detailLineName"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    路線色
                </label>

                <input
                    id="detailLineColor"
                    type="color"
                >

            </div>

            <hr>

            <h3>
                路線の駅
            </h3>

            <div
                id="lineStationChecklist"

            ></div>
</div>

        <div class="modal-footer">

            <button
                id="deleteLineFromModalButton"

                路線を削除
            </button>

            <div class="modal-footer-right">

                <button
                    id="cancelLineModalButton"
                    class="secondary-button"
                >
                    キャンセル
                </button>

                <button
                    id="saveLineDetailButton"
                    class="primary-button"
                >
                    適用
                </button>

        </div>

    </div>

</div>

<div
    id="trainTypeModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">

            <h2>
                列車種別設定
            </h2>

            <button
                id="closeTrainTypeModalButton"
                class="modal-close"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <input
                id="editingTrainTypeId"
                type="hidden"
            >

            <div class="field">

                <label>
                    種別名
                </label>

                <input
                    id="detailTrainTypeName"
                    type="text"
                >

            </div>

            <div class="field">

                <label>
                    種別色
                </label>

                <input
                    id="detailTrainTypeColor"
                    type="color"
                >

            </div>
<div class="field">

                <label>
                    線の上下位置
                </label>

                <input

            </button>

</div>

<div
    id="loginModal"
    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window login-window">

        <div class="modal-header">

            <h2>
                Discordログイン
            </h2>

        </div>

        <div class="modal-body">

            <p>
                路線図を保存するにはDiscordログインが必要です。

            >
                Discordでログイン
            </a>

        </div>

    </div>

</div>

<div
    id="toast"
    class="toast"
></div>

<script>

"use strict";

const state = {

    currentMapId: null,

    map: {

        name: "新しい路線図",

        stations: [],

        lines: [],

        trainTypes: [],

        breaks: []

    },

    selectedLineId: null,

    selectedTrainTypeId: null,

    selectedStationId: null,

    zoom: 1,

    gridVisible: true,

    dragMode: true,

    draggingStation: null,

    dragOffsetX: 0,

    dragOffsetY: 0,
      bendMode: false,
      bendPointerActive: false,
      draggingText: null,
      inlineEditStationId: null,
      selectedBendSegmentId: null

};

const $ = id => document.getElementById(id);

const svg = $("railwayMap");

const stationLayer = $("stationLayer");

const lineLayer = $("lineLayer");

const selectionLayer = $("selectionLayer");

function uid(prefix = "id") {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );

}

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}

function normalizeMapId(value) {
    if (value === null || value === undefined) return null;
    if (typeof value === "string" || typeof value === "number") return String(value);
    if (typeof value === "object") {
        if (value.$oid !== undefined) return String(value.$oid);
        if (value.id !== undefined) return String(value.id);
        if (value._id !== undefined) return normalizeMapId(value._id);
    }
    return null;
}

function normalizeMap() {

    if (!state.map) {

        state.map = {
            name: "新しい路線図",
            stations: [],
            lines: [],
            trainTypes: [],
            breaks: []
        };

    }

    if (!Array.isArray(state.map.stations)) {
        state.map.stations = [];
    }

    if (!Array.isArray(state.map.lines)) {
        state.map.lines = [];
    }

    if (!Array.isArray(state.map.trainTypes)) {
        state.map.trainTypes = [];
    }

    if (!Array.isArray(state.map.breaks)) {
        state.map.breaks = [];
    }

    for (const station of state.map.stations) {

        if (!station.id) {
            station.id = uid("station");
        }

        station.name ??= "";

        station.roman ??= "";

        station.code ??= "";

        station.x ??= 300;

        station.y ??= 300;

        station.visible ??= true;

        station.transfers ??= [];

        if (!Array.isArray(station.transfers)) {
            station.transfers = [];
        }

        station.display ??= {};

        station.display.nameSize ??= 18;

        station.display.romanSize ??= 11;

        station.display.nameDirection ??= "vertical";

        station.display.romanDirection ??= "vertical";

        station.display.nameRotation ??= 0;

        station.display.romanRotation ??= 0;
        station.display.nameVisible ??= true;
        station.display.romanVisible ??= true;
        station.display.nameOffsetX ??= 0;
        station.display.nameOffsetY ??= 0;
        station.display.romanOffsetX ??= 0;
        station.display.romanOffsetY ??= 0;

        station.display.boxMode ??= "auto";

        station.display.boxWidth ??= 80;

        station.display.boxHeight ??= 120;

        station.display.spacingBefore ??= 100;

        station.display.spacingAfter ??= 100;

    }

    for (const line of state.map.lines) {

        if (!line.id) {
            line.id = uid("line");
        }

        line.name ??= "路線";

        line.color ??= "#0066cc";

        line.stationIds ??= [];

        line.trainTypes ??= [];

        line.segments ??= [];

    }

    for (const type of state.map.trainTypes) {

        if (!type.id) {
            type.id = uid("type");
        }

        type.name ??= "種別";

        type.color ??= "#e60012";

        type.lineLength ??= 1000;

        type.lineOffset ??= 0;

        type.lineWidth ??= 5;

    }

}

function getStation(id) {

    return state.map.stations.find(
        station => station.id === id
    );

}

function getLine(id) {

    return state.map.lines.find(
        line => line.id === id
    );

}

function getTrainType(id) {

    return state.map.trainTypes.find(
        type => type.id === id
    );

}

function svgPointFromEvent(event) {

    const rect = svg.getBoundingClientRect();

    const viewBox = svg.viewBox.baseVal;

    const x =
        (event.clientX - rect.left) /
        rect.width *
        viewBox.width;

    const y =
        (event.clientY - rect.top) /
        rect.height *
        viewBox.height;

    return {
        x,
        y
    };

}

function estimateTextWidth(text, size) {

    return Math.max(
        1,
        String(text || "").length
    ) * size * 0.95;

}

function getStationBoxSize(station) {
    const display = station.display || {};
    if (display.boxMode === "manual") {
        return { width: Math.max(20, Number(display.boxWidth) || 80), height: Math.max(20, Number(display.boxHeight) || 120) };
    }
    const nameSize = Number(display.nameSize) || 18;
    const romanSize = Number(display.romanSize) || 11;
    const name = station.name || "";
    const roman = station.roman || "";
    let width = 70;
    let height = 70;
    if ((display.nameDirection || "vertical") === "vertical") {
        height = Math.max(height, [...name].length * nameSize * 1.08 + 34);
        width = Math.max(width, nameSize + 34);
    } else {
        width = Math.max(width, estimateTextWidth(name, nameSize) + 34);
        height = Math.max(height, nameSize + 34);
    }
    if ((display.romanDirection || "vertical") === "vertical") {
        height = Math.max(height, [...roman].length * romanSize * 1.08 + 34);
        width = Math.max(width, nameSize + romanSize + 52);
    } else {
        width = Math.max(width, estimateTextWidth(roman, romanSize) + 34);
        height = Math.max(height, romanSize + 34);
    }
    return { width: Math.max(width, 70), height: Math.max(height, 70) };
}

function createSvgElement(
    tag,
    attributes = {}
) {

    const element =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag
        );

    for (
        const [key, value]
        of Object.entries(attributes)
    ) {

        element.setAttribute(
            key,
            value
        );

    }

    return element;

}

function drawStationText(group, station) {
    const display = station.display || {};
    const box = getStationBoxSize(station);
    const cx = station.x;
    const cy = station.y;
    const name = station.name || "";
    const roman = station.roman || "";
    const nameSize = Number(display.nameSize) || 18;
    const romanSize = Number(display.romanSize) || 11;
    const nameDir = display.nameDirection || "vertical";
    const romanDir = display.romanDirection || "vertical";
    const nameOX = Number(display.nameOffsetX) || 0;
    const nameOY = Number(display.nameOffsetY) || 0;
    const romanOX = Number(display.romanOffsetX) || 0;
    const romanOY = Number(display.romanOffsetY) || 0;

    const stationCount = state.map.lines.flatMap(line => line.trainTypes || [])
        .filter(setting => setting.stationIds?.includes(station.id)).length;
    const large = stationCount >= 2;

    function addTextGroup(type, textValue, direction, size, ox, oy, rotation, role, persistOX = ox, persistOY = oy) {
        if (!textValue) return;
        if (role === "name" && display.nameVisible === false) return;
        if (role === "roman" && display.romanVisible === false) return;
        const g = createSvgElement("g", {
            class: role === "name" ? "station-name-group" : "station-roman-group",
            transform: `rotate(${Number(rotation) || 0} ${cx + ox} ${cy + oy})`,
            "data-text-role": role
        });
        if (direction === "vertical") {
            const chars = [...textValue];
            const step = size * 1.08;
            const total = chars.length * step;
            let y = cy + oy - total / 2 + step / 2;
            const x = cx + ox;
            for (const ch of chars) {
                const t = createSvgElement("text", {
                    x, y, "font-size": size, "text-anchor": "middle",
                    "dominant-baseline": "middle", class: role === "name" ? "station-name" : "station-roman"
                });
                t.textContent = ch;
                g.appendChild(t);
                y += step;
            }
        } else {
            const t = createSvgElement("text", {
                x: cx + ox, y: cy + oy, "font-size": size, "text-anchor": "middle",
                "dominant-baseline": "middle", class: role === "name" ? "station-name" : "station-roman"
            });
            t.textContent = textValue;
            g.appendChild(t);
        }
        group.appendChild(g);
    }

    if (large) {
        addTextGroup("name", name, nameDir, nameSize, nameOX, nameOY, display.nameRotation, "name", nameOX, nameOY);
        if (roman) {
            const defaultRomanX = romanDir === "vertical" ? box.width * 0.28 : 0;
            const defaultRomanY = romanDir === "vertical" ? 0 : box.height * 0.28;
            addTextGroup("roman", roman, romanDir, romanSize, romanOX + defaultRomanX, romanOY + defaultRomanY, display.romanRotation, "roman", romanOX, romanOY);
        }
    } else {
        const nameDefaultY = 24;
        addTextGroup("name", name, nameDir, nameSize, nameOX, nameOY + nameDefaultY, display.nameRotation, "name", nameOX, nameOY);
        if (roman) {
            const romanDefaultX = nameDir === "vertical" ? nameSize * 1.8 : 0;
            const romanDefaultY = nameDir === "vertical" ? nameDefaultY : nameDefaultY + romanSize * 1.4;
            addTextGroup("roman", roman, romanDir, romanSize, romanOX + romanDefaultX, romanOY + romanDefaultY, display.romanRotation, "roman", romanOX, romanOY);
        }
    }
}

function trainTypeStopsAt(
    line,
    trainTypeId,
    stationId
) {

    const setting =
        line.trainTypes.find(
            item =>
                item.trainTypeId ===
                trainTypeId
        );

    if (!setting) {
        return false;
    }

    return setting.stationIds
        .includes(stationId);

}

function getBendPoints(line, fromStationId, toStationId) {
    const item = (line.segments || []).find(segment => segment.fromStationId === fromStationId && segment.toStationId === toStationId);
    return item?.points || [];
}

function distancePointToSegment(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy || 1;
    const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / len2, 0, 1);
    const q = { x: a.x + dx * t, y: a.y + dy * t };
    return { d2: (p.x - q.x) ** 2 + (p.y - q.y) ** 2, point: q };
}

function renderTrainTypeLine(line, trainType, typeIndex, activeTypeCount) {
    const setting = line.trainTypes.find(item => item.trainTypeId === trainType.id);
    if (!setting) return;
    const stations = (setting.stationIds || []).map(getStation).filter(Boolean).filter(station => station.visible);
    if (stations.length < 2) return;
    const width = Number(trainType.lineWidth) || 5;
    const baseOffset = Number(trainType.lineOffset) || 0;
    const laneGap = Math.max(width + 4, 10);
    const laneOffset = baseOffset + (typeIndex - (activeTypeCount - 1) / 2) * laneGap;

    for (let i = 0; i < stations.length - 1; i++) {
        const a = stations[i], b = stations[i + 1];
        const bend = getBendPoints(line, a.id, b.id);
        const points = [{ x: a.x, y: a.y + laneOffset }, ...bend.map(p => ({ x: p.x, y: p.y + laneOffset })), { x: b.x, y: b.y + laneOffset }];
        const polyline = createSvgElement("polyline", {
            points: points.map(p => `${p.x},${p.y}`).join(" "), fill: "none", stroke: trainType.color,
            "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round", class: "map-line"
        });
        lineLayer.appendChild(polyline);
        const hit = createSvgElement("polyline", {
            points: points.map(p => `${p.x},${p.y}`).join(" "), fill: "none", stroke: "transparent",
            "stroke-width": Math.max(18, width + 12), class: "map-line-hit"
        });
        hit.addEventListener("click", event => {
            event.stopPropagation();
            if (state.bendMode) return;
            const segment = (line.segments || []).find(s => s.fromStationId === a.id && s.toStationId === b.id);
            if (!segment || !segment.points?.length) return;
            if (confirm("この折れ線を削除しますか？")) {
                line.segments = line.segments.filter(s => s !== segment);
                state.selectedBendSegmentId = null;
                renderMap();
            }
        });
        lineLayer.appendChild(hit);
    }
}

function renderTransferGuides(group, station, box) {
    const transfers = station.transfers || [];
    if (!transfers.length) return;
    const startX = station.x + box.width / 2 + 8;
    const startY = station.y - (transfers.length - 1) * 48;
    transfers.forEach((label, index) => {
        const y = startY + index * 96;
        const boxX = startX + 34;
        const boxY = y - 34;
        const elbowX = startX + 16;
        group.appendChild(createSvgElement("path", {
            d: `M ${station.x + box.width / 2} ${station.y} H ${elbowX} V ${y} H ${boxX}`,
            fill: "none", stroke: "#64748b", "stroke-width": 2,
            "stroke-linecap": "round", "stroke-linejoin": "round", class: "station-transfer-line"
        }));
        group.appendChild(createSvgElement("rect", {
            x: boxX, y: boxY, width: 24, height: 68, rx: 6,
            fill: "white", stroke: "#64748b", "stroke-width": 1.5, class: "station-transfer-box"
        }));
        const chars = [...String(label || "")];
        chars.forEach((ch, i) => {
            const t = createSvgElement("text", {
                x: boxX + 12, y: boxY + 13 + i * 12,
                "font-size": 10, "text-anchor": "middle", "dominant-baseline": "middle",
                class: "station-transfer"
            });
            t.textContent = ch;
            group.appendChild(t);
        });
    });
}

function renderStationInlineEditor(group, station, box) {
    if (state.inlineEditStationId !== station.id) return;
    const fo = createSvgElement("foreignObject", {
        x: station.x - 105, y: station.y + box.height / 2 + 10,
        width: 210, height: 104, class: "station-inline-editor"
    });
    const div = document.createElement("div");
    div.className = "station-inline-editor-box";
    div.innerHTML = `
        <div class="station-inline-row"><label>前間隔</label><input data-inline="before" type="number" min="0" value="${Number(station.display.spacingBefore) || 100}"></div>
        <div class="station-inline-row"><label>次間隔</label><input data-inline="after" type="number" min="0" value="${Number(station.display.spacingAfter) || 100}"></div>
        <div class="station-inline-checks">
            <label><input data-inline="nameVisible" type="checkbox" ${station.display.nameVisible !== false ? "checked" : ""}> 駅名表示</label>
            <label><input data-inline="romanVisible" type="checkbox" ${station.display.romanVisible !== false ? "checked" : ""}> ローマ字表示</label>
        </div>`;
    for (const input of div.querySelectorAll("input")) {
        input.addEventListener("pointerdown", e => e.stopPropagation());
        input.addEventListener("change", e => {
            const key = e.target.dataset.inline;
            if (key === "nameVisible" || key === "romanVisible") station.display[key] = e.target.checked;
            else station.display[key === "before" ? "spacingBefore" : "spacingAfter"] = Number(e.target.value) || 0;
            if (key === "before" || key === "after") applyStationSpacing(station);
            renderMap();
        });
    }
    fo.appendChild(div);
    group.appendChild(fo);
}

function applyStationSpacing(station) {
    const index = state.map.stations.findIndex(s => s.id === station.id);
    if (index < 0) return;
    const before = Number(station.display.spacingBefore) || 0;
    const after = Number(station.display.spacingAfter) || 0;
    if (index > 0) {
        const prev = state.map.stations[index - 1];
        station.x = prev.x + before;
    }
    if (index < state.map.stations.length - 1) {
        const next = state.map.stations[index + 1];
        next.x = station.x + after;
    }
}

function renderStation(station) {
    if (!station.visible) return;
    const group = createSvgElement("g", { class: "station-node station-group" });
    group.dataset.stationId = station.id;
    const box = getStationBoxSize(station);
    const stationCount = state.map.lines.flatMap(line => line.trainTypes || [])
        .filter(setting => setting.stationIds?.includes(station.id)).length;
    if (stationCount >= 2) {
        group.appendChild(createSvgElement("rect", {
            x: station.x - box.width / 2, y: station.y - box.height / 2,
            width: box.width, height: box.height, rx: 4, ry: 4, fill: "white", stroke: "#111", "stroke-width": 4, class: "station-large-box"
        }));
    } else {
        group.appendChild(createSvgElement("circle", {
            cx: station.x, cy: station.y, r: 10, fill: "white", stroke: "#111", "stroke-width": 4, class: "station-small-marker-circle"
        }));
    }
    drawStationText(group, station);
    renderTransferGuides(group, station, box);
    renderStationInlineEditor(group, station, box);

    group.addEventListener("pointerdown", event => {
        if (event.target.closest?.("foreignObject")) return;
        if (state.bendMode) return;
        event.stopPropagation();
        state.selectedStationId = station.id;
        const p = svgPointFromEvent(event);
        state.draggingStation = station;
        state.dragOffsetX = station.x - p.x;
        state.dragOffsetY = station.y - p.y;
        group.dataset.dragStartX = station.x;
        group.dataset.dragStartY = station.y;
        group.setPointerCapture(event.pointerId);
    });
    group.addEventListener("pointermove", event => {
        if (state.draggingStation !== station) return;
        const p = svgPointFromEvent(event);
        station.x = clamp(p.x + state.dragOffsetX, 20, 50000);
        station.y = clamp(p.y + state.dragOffsetY, 20, 980);
        const startX = Number(group.dataset.dragStartX);
        const startY = Number(group.dataset.dragStartY);
        group.setAttribute("transform", `translate(${station.x - startX} ${station.y - startY})`);
    });
    group.addEventListener("pointerup", event => {
        if (state.draggingStation === station) {
            state.draggingStation = null;
            try { group.releasePointerCapture(event.pointerId); } catch {}
            renderMap();
        }
    });
    stationLayer.appendChild(group);
}

function renderMap() {
    normalizeMap();
    stationLayer.innerHTML = "";
    lineLayer.innerHTML = "";
    selectionLayer.innerHTML = "";
    for (const line of state.map.lines) {
        const active = (line.trainTypes || []).filter(setting => (setting.stationIds || []).length >= 2);
        active.forEach((setting, index) => {
            const type = getTrainType(setting.trainTypeId);
            if (type) renderTrainTypeLine(line, type, index, active.length);
        });
    }
    for (const line of state.map.lines) {
        for (const segment of line.segments || []) {
            for (const point of segment.points || []) {
                lineLayer.appendChild(createSvgElement("circle", {
                    cx: point.x, cy: point.y, r: 5, fill: "white", stroke: "#333", "stroke-width": 2, class: "bend-point"
                }));
            }
        }
    }
    for (const station of state.map.stations) renderStation(station);
    updateLists();
}

function ensureLineTrainTypeSetting(line, typeId) {
    let setting = line.trainTypes.find(item => item.trainTypeId === typeId);
    if (!setting) {
        setting = { trainTypeId: typeId, stationIds: [] };
        line.trainTypes.push(setting);
    }
    return setting;
}

function updateLineStationEditor() {
    const container = $("lineStationEditor");
    container.innerHTML = "";
    const line = getLine(state.selectedLineId);
    if (!line) { container.textContent = "路線を選択してください。"; return; }
    const title = document.createElement("h4");
    title.textContent = "路線の駅";
    container.appendChild(title);
    for (const station of state.map.stations) {
        const item = document.createElement("div");
        item.className = "line-station-item";
        const label = document.createElement("label");
        label.className = "checkbox-row";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = line.stationIds.includes(station.id);
        checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
                if (!line.stationIds.includes(station.id)) line.stationIds.push(station.id);
            } else {
                line.stationIds = line.stationIds.filter(id => id !== station.id);
                for (const setting of line.trainTypes) setting.stationIds = setting.stationIds.filter(id => id !== station.id);
            }
            updateLineStationEditor();
            renderMap();
        });
        label.appendChild(checkbox);
        const span = document.createElement("span");
        span.textContent = station.name;
        label.appendChild(span);
        item.appendChild(label);
        if (checkbox.checked && state.map.trainTypes.length) {
            const stopBox = document.createElement("div");
            stopBox.className = "station-stop-settings";
            const small = document.createElement("small");
            small.textContent = "停車する列車種別";
            stopBox.appendChild(small);
            for (const type of state.map.trainTypes) {
                const typeSetting = ensureLineTrainTypeSetting(line, type.id);
                const typeLabel = document.createElement("label");
                typeLabel.className = "checkbox-row";
                const typeCheck = document.createElement("input");
                typeCheck.type = "checkbox";
                typeCheck.checked = typeSetting.stationIds.includes(station.id);
                typeCheck.addEventListener("change", () => {
                    if (typeCheck.checked) {
                        if (!typeSetting.stationIds.includes(station.id)) typeSetting.stationIds.push(station.id);

function renderLineModalStations(line) {
    const container = $("lineStationChecklist");
    container.innerHTML = "";
    for (const station of state.map.stations) {
        const item = document.createElement("div");
        item.className = "line-station-item";
        const label = document.createElement("label");
        label.className = "checkbox-row";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = line.stationIds.includes(station.id);
        checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
                if (!line.stationIds.includes(station.id)) line.stationIds.push(station.id);
            } else {
                line.stationIds = line.stationIds.filter(id => id !== station.id);
                for (const setting of line.trainTypes) setting.stationIds = setting.stationIds.filter(id => id !== station.id);
            }
            renderLineModalStations(line);
            renderMap();
        });
        label.appendChild(checkbox);
        const span = document.createElement("span");
        span.textContent = station.name;
        label.appendChild(span);
        item.appendChild(label);
        if (checkbox.checked && state.map.trainTypes.length) {
            const stopBox = document.createElement("div");
            stopBox.className = "station-stop-settings";
            for (const type of state.map.trainTypes) {
                const setting = ensureLineTrainTypeSetting(line, type.id);
                const typeLabel = document.createElement("label");
                typeLabel.className = "checkbox-row";
                const typeCheck = document.createElement("input");
                typeCheck.type = "checkbox";
                typeCheck.checked = setting.stationIds.includes(station.id);
                typeCheck.addEventListener("change", () => {
                    if (typeCheck.checked) {
                        if (!setting.stationIds.includes(station.id)) setting.stationIds.push(station.id);
                    } else {
                        setting.stationIds = setting.stationIds.filter(id => id !== station.id);
                    }
                    renderMap();
                });
                typeLabel.appendChild(typeCheck);
                const typeSpan = document.createElement("span");
                typeSpan.textContent = type.name;
                typeSpan.style.borderLeft = `5px solid ${type.color}`;
                typeSpan.style.paddingLeft = "8px";
                typeLabel.appendChild(typeSpan);

            }
            item.appendChild(stopBox);
        }
        container.appendChild(item);
    }

svg.addEventListener("pointerdown", event => {
    if (!state.bendMode || state.bendPointerActive) return;
    const line = getLine(state.selectedLineId);
    if (!line) return;
    const p = svgPointFromEvent(event);
    const candidates = [];
    for (const setting of line.trainTypes || []) {
        const type = getTrainType(setting.trainTypeId);
        if (!type) continue;
        const stations = (setting.stationIds || []).map(getStation).filter(Boolean).filter(s => s.visible);
        const laneGap = Math.max((Number(type.lineWidth) || 5) + 4, 10);
        const typeIndex = line.trainTypes.indexOf(setting);
        const laneOffset = (Number(type.lineOffset) || 0) + (typeIndex - (line.trainTypes.length - 1) / 2) * laneGap;
        for (let i = 0; i < stations.length - 1; i++) {
            const a = stations[i], b = stations[i + 1];
            const existing = getBendPoints(line, a.id, b.id).map(q => ({x:q.x, y:q.y + laneOffset}));
            const pts = [{x:a.x,y:a.y+laneOffset}, ...existing, {x:b.x,y:b.y+laneOffset}];
            for (let j = 0; j < pts.length - 1; j++) {
                const hit = distancePointToSegment(p, pts[j], pts[j + 1]);
                candidates.push({ ...hit, fromId:a.id, toId:b.id, typeIndex });
            }
        }
    }
    candidates.sort((a,b) => a.d2 - b.d2);
    const best = candidates[0];
    if (!best || best.d2 > 3600) { showToast("実際の路線線上をクリックしてください"); state.bendPointerActive = false; return; }
    let segment = (line.segments || []).find(s => s.fromStationId === best.fromId && s.toStationId === best.toId);
    if (!segment) {
        segment = { id: uid("segment"), fromStationId: best.fromId, toStationId: best.toId, points: [] };
        line.segments.push(segment);
    }
    const laneGap = candidates.length ? Math.max((Number(getTrainType(line.trainTypes[best.typeIndex]?.trainTypeId)?.lineWidth) || 5) + 4, 10) : 10;
    const type = getTrainType(line.trainTypes[best.typeIndex]?.trainTypeId);
    const laneOffset = (Number(type?.lineOffset) || 0) + (best.typeIndex - (line.trainTypes.length - 1) / 2) * laneGap;
    const rawPoint = { x: best.point.x, y: best.point.y - laneOffset };
    segment.points.push(rawPoint);
    segment.points.sort((u,v) => {
        const a = getStation(segment.fromStationId), b = getStation(segment.toStationId);
        const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy || 1;
        return (((u.x-a.x)*dx+(u.y-a.y)*dy)/len2) - (((v.x-a.x)*dx+(v.y-a.y)*dy)/len2);
    });
    state.bendPointerActive = true;
    renderMap();
});

document.addEventListener("pointerup", () => {
    if (state.bendPointerActive) state.bendPointerActive = false;
});

async function saveMap() {

    try {

        const userResponse =
            await fetch(
                "/api/user"
            );

        const userData =
            await userResponse.json();

        if (
            !userData ||
            !userData.user
        ) {

            $("loginModal")
                .classList.remove(
                    "hidden"
                );

            return;

        }

        state.map.name =
            $("mapName")
                .value
                .trim() ||
            "無題の路線図";

        const payload = {

            name:
                state.map.name,

            data:
                state.map

        };

        let response;

        if (state.currentMapId) {

            response =
                await fetch(
                    `/api/railway/maps/${state.currentMapId}`,
                    {
                        method:
                            "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        } else {

            response =
                await fetch(
                    "/api/railway/maps",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        }

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "保存に失敗しました"
            );

        }

        if (result.id) {

            state.currentMapId = normalizeMapId(result.id ?? result._id);

        }

        showToast(
            "路線図を保存しました"
        );

        await loadMapList();

    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "保存に失敗しました"
        );

    }

}

            `;

            row.querySelector(

                    loadMap(normalizeMapId(map._id ?? map.id));

            );

            row.querySelector(

                "click",
                () => {

                    deleteMap(normalizeMapId(map._id ?? map.id));

                }
            );

            container.appendChild(

            );

        }

    } catch (error) {

        console.error(error);

        container.textContent =
            "保存済み路線図を取得できませんでした。";

    }

        state.currentMapId = normalizeMapId(result.id ?? result._id) || id;

            state.map.name ||

        showToast(

        );

    } catch (error) {

        console.error(error);

            error.message ||

        );

}

    id
) {

            const user =
                result.user;

            let avatar =
                "";

            if (
                user.avatar &&
                user.discordId
            ) {

                avatar =
                    `https://cdn.discordapp.com/avatars/${user.discordId}/${user.avatar}.png?size=64`;

            }

            userArea.innerHTML = `

                ${
                    avatar
                        ? `
                            <img
                                class="user-avatar"
                                src="${avatar}"
                                alt=""
                            >
                          `
                        : ""
                }

                <span>
                    ${escapeHtml(
                        user.username ||
                        "Discord User"
                    )}
                </span>

                <a
                    href="/logout"
                    class="logout-link"
                >
                    ログアウト
                </a>

            `;

            loadMapList();

        } else {

            userArea.innerHTML = `

                <a
                    href="/auth/discord"
                    class="login-link"
                >
                    Discordでログイン
                </a>

            `;

        }

    } catch (error) {

        console.error(
            "User load error:",
            error
        );

    }

}

document.addEventListener(
    "keydown",
    event => {

        if (
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            event.key.toLowerCase() ===
                "s"
        ) {

            event.preventDefault();

            saveMap();

        }

        if (
            event.key ===
            "Escape"
        ) {

            closeStationModal();

            closeLineModal();

            closeTrainTypeModal();

        }

    }
);

$("mapName")
    .addEventListener(
        "input",
        event => {

            state.map.name =
                event.target.value;

        }
    );

normalizeMap();

$("mapName").value =
    state.map.name;

renderMap();

loadUser();

</script>

</body>
</html>
