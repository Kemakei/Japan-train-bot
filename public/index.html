<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Railway Map Editor</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="app-header">

    <div class="header-left">
        <div class="app-title">
            Railway Map Editor
        </div>

        <div class="app-subtitle">
            鉄道路線案内表エディタ
        </div>
    </div>

    <div class="header-right">

        <button
            id="saveButton"
            class="primary-button"
        >
            保存
        </button>

        <button
            id="newMapButton"
            class="secondary-button"
        >
            新規作成
        </button>

        <div
            id="userArea"
            class="user-area"
        ></div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="app-main">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <!-- Map -->
        <section class="panel">

            <div class="panel-title">
                路線図
            </div>

            <div class="field">

                <label for="mapName">
                    路線図名
                </label>

                <input
                    id="mapName"
                    type="text"
                    placeholder="例：神戸線案内表"
                >

            </div>

            <div class="button-row">

                <button
                    id="loadMapsButton"
                    class="secondary-button"
                >
                    保存済みを表示
                </button>

            </div>

            <div
                id="savedMaps"
                class="saved-maps"
            ></div>

        </section>


        <!-- =================================================
             STATIONS
        ================================================== -->

        <section class="panel">

            <div class="panel-title">
                駅
            </div>

            <div class="field">

                <label for="stationName">
                    駅名
                </label>

                <input
                    id="stationName"
                    type="text"
                    placeholder="例：神戸三宮"
                >

            </div>


            <div class="field">

                <label for="stationRoman">
                    ローマ字
                </label>

                <input
                    id="stationRoman"
                    type="text"
                    placeholder="例：Kobe-Sannomiya"
                >

            </div>


            <div class="field">

                <label for="stationCode">
                    駅コード
                </label>

                <input
                    id="stationCode"
                    type="text"
                    placeholder="例：HK-16"
                >

            </div>


            <div class="field">

                <label for="stationTransfers">
                    乗換案内
                </label>

                <textarea
                    id="stationTransfers"
                    rows="4"
                    placeholder="1行につき1路線&#10;JR神戸線&#10;阪神本線&#10;神戸市営地下鉄"
                ></textarea>

            </div>


            <button
                id="addStationButton"
                class="primary-button full-width"
            >
                駅を追加
            </button>


            <div
                id="stationList"
                class="editor-list"
            ></div>

        </section>


        <!-- =================================================
             LINES
        ================================================== -->

        <section class="panel">

            <div class="panel-title">
                路線
            </div>


            <div class="field">

                <label for="lineName">
                    路線名
                </label>

                <input
                    id="lineName"
                    type="text"
                    placeholder="例：神戸線"
                >

            </div>


            <div class="field">

                <label for="lineColor">
                    路線色
                </label>

                <input
                    id="lineColor"
                    type="color"
                    value="#0066cc"
                >

            </div>


            <button
                id="addLineButton"
                class="primary-button full-width"
            >
                路線を追加
            </button>


            <div
                id="lineList"
                class="editor-list"
            ></div>

        </section>


        <!-- =================================================
             TRAIN TYPES
        ================================================== -->

        <section class="panel">

            <div class="panel-title">
                列車種別
            </div>


            <div class="field">

                <label for="trainTypeName">
                    種別名
                </label>

                <input
                    id="trainTypeName"
                    type="text"
                    placeholder="例：特急"
                >

            </div>


            <div class="field">

                <label for="trainTypeColor">
                    種別色
                </label>

                <input
                    id="trainTypeColor"
                    type="color"
                    value="#e60012"
                >

            </div>


            <button
                id="addTrainTypeButton"
                class="primary-button full-width"
            >
                種別を追加
            </button>


            <div
                id="trainTypeList"
                class="editor-list"
            ></div>

        </section>


        <!-- =================================================
             CURRENT LINE / TRAIN TYPE
        ================================================== -->

        <section class="panel">

            <div class="panel-title">
                選択中の路線・種別
            </div>


            <div class="field">

                <label for="selectedLine">
                    路線
                </label>

                <select id="selectedLine">
                    <option value="">
                        路線を選択
                    </option>
                </select>

            </div>


            <div class="field">

                <label for="selectedTrainType">
                    列車種別
                </label>

                <select id="selectedTrainType">
                    <option value="">
                        種別を選択
                    </option>
                </select>

            </div>


            <div
                id="lineStationEditor"
                class="line-station-editor"
            ></div>

        </section>


        <!-- =================================================
             LINE DISPLAY SETTINGS
        ================================================== -->

        <section class="panel">

            <div class="panel-title">
                種別線設定
            </div>


            <div class="field">

                <label for="lineLength">
                    線の長さ
                </label>

                <input
                    id="lineLength"
                    type="number"
                    min="50"
                    max="5000"
                    step="10"
                    value="1000"
                >

                <small>
                    種別ごとに個別設定できます
                </small>

            </div>


            <div class="field">

                <label for="lineOffset">
                    線の上下位置
                </label>

                <input
                    id="lineOffset"
                    type="number"
                    min="-1000"
                    max="1000"
                    step="5"
                    value="0"
                >

            </div>


            <div class="button-row">

                <button
                    id="applyLineSettingsButton"
                    class="primary-button"
                >
                    適用
                </button>

            </div>

        </section>


        <!-- =================================================
             DISPLAY SETTINGS
        ================================================== -->

        <section class="panel">

            <div class="panel-title">
                表示設定
            </div>


            <div class="button-row">

                <button
                    id="addBreakButton"
                    class="secondary-button"
                >
                    区切りを追加
                </button>

                <button
                    id="addBendButton"
                    class="secondary-button"
                >
                    折れ曲がりを追加
                </button>

            </div>

        </section>

    </aside>


    <!-- =====================================================
         WORKSPACE
    ====================================================== -->

    <section class="workspace">

        <div class="workspace-toolbar">

            <div class="toolbar-left">

                <button
                    id="zoomOutButton"
                    class="icon-button"
                    title="縮小"
                >
                    −
                </button>

                <button
                    id="zoomResetButton"
                    class="icon-button"
                    title="100%"
                >
                    100%
                </button>

                <button
                    id="zoomInButton"
                    class="icon-button"
                    title="拡大"
                >
                    ＋
                </button>

                <button
                    id="fitButton"
                    class="secondary-button"
                >
                    全体表示
                </button>

            </div>


            <div class="toolbar-right">

                <button
                    id="toggleGridButton"
                    class="secondary-button"
                >
                    グリッド
                </button>

                <button
                    id="toggleDragModeButton"
                    class="secondary-button"
                >
                    駅移動
                </button>

            </div>

        </div>


        <!-- =================================================
             MAP
        ================================================== -->

        <div
            id="mapViewport"
            class="map-viewport"
        >

            <svg
                id="railwayMap"
                class="railway-map"
                viewBox="0 0 1600 1000"
                preserveAspectRatio="xMidYMid meet"
            >

                <defs>

                    <pattern
                        id="gridPattern"
                        width="40"
                        height="40"
                        patternUnits="userSpaceOnUse"
                    >

                        <path
                            d="M 40 0 L 0 0 0 40"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1"
                            opacity="0.08"
                        />

                    </pattern>

                </defs>


                <!-- 背景 -->

                <rect
                    id="mapBackground"
                    x="0"
                    y="0"
                    width="1600"
                    height="1000"
                    fill="transparent"
                />


                <!-- グリッド -->

                <rect
                    id="mapGrid"
                    x="0"
                    y="0"
                    width="1600"
                    height="1000"
                    fill="url(#gridPattern)"
                />


                <!-- 線 -->

                <g id="lineLayer"></g>


                <!-- 区切り -->

                <g id="breakLayer"></g>


                <!-- 駅 -->

                <g id="stationLayer"></g>


                <!-- 選択表示 -->

                <g id="selectionLayer"></g>

            </svg>

        </div>


        <div
            id="statusBar"
            class="status-bar"
        >
            準備完了
        </div>

    </section>

</main>


<!-- =========================================================
     STATION DETAIL MODAL
========================================================= -->

    class="modal hidden"
>

    <div class="modal-backdrop"></div>

    <div class="modal-window">

        <div class="modal-header">

            <h2>
                駅の詳細設定
            </h2>

                class="modal-close"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <input
                id="editingStationId"
                type="hidden"
            >


            <div class="field">

                <label>
                    駅名
                </label>

                <input
                    id="detailStationName"
                    type="text"
                >

            </div>


            <div class="field">

                <label>
                    ローマ字
                </label>

                <input
                    id="detailStationRoman"
                    type="text"
                >

            </div>


            <div class="field">

                <label>
                    駅コード
                </label>

                <input
                    id="detailStationCode"
                    type="text"
                >

            </div>


            <div class="field">

                <label>
                    表示
                </label>

                <select id="detailStationVisible">

                    <option value="true">
                        表示

                    <option value="false">
                        非表示
                    </option>

                </select>

            </div>


            <hr>


            <h3>
                駅名表示

            <div class="field">

                <label>
                    文字方向

                <select id="detailNameDirection">

                    <option value="vertical">
                        縦書き
                    </option>

                    <option value="horizontal">
                        横書き
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    文字サイズ
                </label>

                <input
                    id="detailNameSize"
                    type="number"
                    min="6"
                    max="100"
                    value="18"
                >

            </div>


            <div class="field">

                <label>
                    回転
                </label>

                <select id="detailNameRotation">

                    <option value="0">
                        0°
                    </option>

                    <option value="45">
                        45°
                    </option>

                    <option value="90">
                        90°
                    </option>

                    <option value="-45">
                        -45°
                    </option>

                    <option value="-90">
                        -90°
                    </option>

                </select>

            </div>


            <hr>


            <h3>
                ローマ字表示
            </h3>


            <div class="field">

                <label>
                    文字方向
                </label>

                <select id="detailRomanDirection">

                    <option value="horizontal">
                        横書き
                    </option>

                    <option value="vertical">
                        縦書き
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    文字サイズ
                </label>

                <input
                    id="detailRomanSize"
                    type="number"
                    min="5"
                    max="80"
                    value="11"
                >

            </div>


            <div class="field">

                <label>
                    回転
                </label>

                <select id="detailRomanRotation">

                    <option value="0">
                        0°
                    </option>

                    <option value="45">
                        45°
                    </option>

                    <option value="90">
                        90°
                    </option>

                    <option value="-45">
                        -45°
                    </option>

                    <option value="-90">
                        -90°
                    </option>

                </select>

            </div>


            <hr>


            <h3>
                駅の間隔
            </h3>


            <div class="field">

                <label>
                    前の駅からの距離
                </label>

                <input
                    id="detailSpacingBefore"
                    type="number"
                    min="20"
                    max="1000"
                    value="100"
                >

            </div>


            <div class="field">

                <label>
                    次の駅までの距離
                </label>

                <input
                    id="detailSpacingAfter"
                    type="number"
                    min="20"
                    max="1000"
                    value="100"
                >

            </div>


            <hr>


            <h3>
                駅BOX
            </h3>


            <div class="field">

                <label>
                    BOXサイズ
                </label>

                <select id="detailBoxMode">

                    <option value="auto">
                        自動
                    </option>

                    <option value="manual">
                        手動
                    </option>

                </select>

            </div>


            <div
                id="manualBoxSettings"
                class="hidden"
            >

                <div class="field">

                    <label>
                        幅
                    </label>

                    <input
                        id="detailBoxWidth"
                        type="number"
                        min="20"
                        max="500"
                        value="80"
                    >

                </div>


                <div class="field">

                    <label>
                        高さ
                    </label>

                    <input
                        id="detailBoxHeight"
                        type="number"
                        min="20"
                        max="500"
                        value="120"
                    >

                </div>

            </div>


            <hr>


            <h3>
                乗換案内
            </h3>


            <div class="field">

                <textarea
                    id="detailTransfers"
                    rows="5"
                    placeholder="1行につき1路線"
                ></textarea>

            </div>

        </div>


        <div class="modal-footer">

            <button
                id="deleteStationFromModalButton"
                class="danger-button"
            >
                駅を削除
            </button>

            <div class="modal-footer-right">

                <button
                    id="cancelStationModalButton"
                    class="secondary-button"
                >
                    キャンセル
                </button>

                <button
                    id="saveStationDetailButton"
                    class="primary-button"
                >
                    適用
                </button>

            </div>

        </div>

    </div>

</div>

<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

"use strict";


/* =========================================================
   DATA
========================================================= */

const state = {

    currentMapId: null,

    map: {

        name: "新しい路線図",

        stations: [],

        lines: [],

        trainTypes: [],

        breaks: []

    },

    selectedLineId: null,

    selectedTrainTypeId: null,

    selectedStationId: null,

    zoom: 1,

    gridVisible: true,

    dragMode: true,

    draggingStation: null,

    dragOffsetX: 0,

    dragOffsetY: 0,
    bendMode: false,
    bendPointerActive: false

};


/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const svg = $("railwayMap");

const stationLayer = $("stationLayer");

const lineLayer = $("lineLayer");

const breakLayer = $("breakLayer");

const selectionLayer = $("selectionLayer");


/* =========================================================
   UTIL
========================================================= */

function uid(prefix = "id") {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );

}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}


function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


function normalizeMap() {

    if (!state.map) {

        state.map = {
            name: "新しい路線図",
            stations: [],
            lines: [],
            trainTypes: [],
            breaks: []
        };

    }

    if (!Array.isArray(state.map.stations)) {
        state.map.stations = [];
    }

    if (!Array.isArray(state.map.lines)) {
        state.map.lines = [];
    }

    if (!Array.isArray(state.map.trainTypes)) {
        state.map.trainTypes = [];
    }

    if (!Array.isArray(state.map.breaks)) {
        state.map.breaks = [];
    }


    for (const station of state.map.stations) {

        if (!station.id) {
            station.id = uid("station");
        }

        station.name ??= "";

        station.roman ??= "";

        station.code ??= "";

        station.x ??= 300;

        station.y ??= 300;

        station.visible ??= true;

        station.transfers ??= [];

        if (!Array.isArray(station.transfers)) {
            station.transfers = [];
        }


        station.display ??= {};

        station.display.nameSize ??= 18;

        station.display.romanSize ??= 11;

        station.display.nameDirection ??= "vertical";

        station.display.romanDirection ??= "horizontal";

        station.display.nameRotation ??= 0;

        station.display.romanRotation ??= 0;

        station.display.boxMode ??= "auto";

        station.display.boxWidth ??= 80;

        station.display.boxHeight ??= 120;

        station.display.spacingBefore ??= 100;

        station.display.spacingAfter ??= 100;
        station.display.nameOffsetX ??= 0;
        station.display.nameOffsetY ??= 0;
        station.display.romanOffsetX ??= 0;
        station.display.romanOffsetY ??= 0;

    }


    for (const line of state.map.lines) {

        if (!line.id) {
            line.id = uid("line");
        }

        line.name ??= "路線";

        line.color ??= "#0066cc";

        line.stationIds ??= [];

        line.trainTypes ??= [];

        line.segments ??= [];

    }


    for (const type of state.map.trainTypes) {

        if (!type.id) {
            type.id = uid("type");
        }

        type.name ??= "種別";

        type.color ??= "#e60012";

        type.lineLength ??= 1000;

        type.lineOffset ??= 0;

        type.lineWidth ??= 5;

    }

}


function getStation(id) {

    return state.map.stations.find(
        station => station.id === id
    );

}


function getLine(id) {

    return state.map.lines.find(
        line => line.id === id
    );

}


function getTrainType(id) {

    return state.map.trainTypes.find(
        type => type.id === id
    );

}


/* =========================================================
   SVG
========================================================= */

function svgPointFromEvent(event) {

    const rect = svg.getBoundingClientRect();

    const viewBox = svg.viewBox.baseVal;

    const x =
        (event.clientX - rect.left) /
        rect.width *
        viewBox.width;

    const y =
        (event.clientY - rect.top) /
        rect.height *
        viewBox.height;

    return {
        x,
        y
    };

}


/* =========================================================
   STATION BOX SIZE
========================================================= */

function estimateTextWidth(text, size) {

    return Math.max(
        1,
        String(text || "").length
    ) * size * 0.95;

}


function getStationBoxSize(station) {

    const display = station.display || {};

    if (display.boxMode === "manual") {

        return {
            width: Number(display.boxWidth) || 80,
            height: Number(display.boxHeight) || 120
        };

    }


    const nameSize =
        Number(display.nameSize) || 18;

    const romanSize =
        Number(display.romanSize) || 11;


    const name =
        station.name || "";

    const roman =
        station.roman || "";


    let width = 50;

    let height = 70;


    if (
        display.nameDirection ===
        "horizontal"
    ) {

        width = Math.max(
            width,
            estimateTextWidth(
                name,
                nameSize
            ) + 30
        );

        height += nameSize + 10;

    } else {

        height = Math.max(
            height,
            name.length *
                nameSize *
                1.15 +
                30
        );

    }


    if (
        display.romanDirection ===
        "horizontal"
    ) {

        width = Math.max(
            width,
            estimateTextWidth(
                roman,
                romanSize
            ) + 30
        );

        height += romanSize + 10;

    } else {

        height +=
            roman.length *
            romanSize *
            1.1;

    }


    width = Math.max(
        width,
        60
    );

    height = Math.max(
        height,
        70
    );


    return {
        width,
        height
    };

}


/* =========================================================
   SVG TEXT
========================================================= */

function createSvgElement(
    tag,
    attributes = {}
) {

    const element =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag
        );

    for (
        const [key, value]
        of Object.entries(attributes)
    ) {

        element.setAttribute(
            key,
            value
        );

    }

    return element;

}


function getStationStopCount(stationId) {

    const ids = new Set();

    for (const line of state.map.lines) {

        for (const setting of line.trainTypes || []) {

            if (setting.stationIds?.includes(stationId)) {
                ids.add(`${line.id}:${setting.trainTypeId}`);
            }

        }

    }

    return ids.size;

}


function makeDraggableText(textGroup, station, kind) {

    let dragging = false;
    let startPoint = null;
    let startX = 0;
    let startY = 0;

    textGroup.style.cursor = "move";

    textGroup.addEventListener("pointerdown", event => {

        event.stopPropagation();

        const point = svgPointFromEvent(event);
        const display = station.display;

        dragging = true;
        startPoint = point;
        startX = Number(display[`${kind}OffsetX`]) || 0;
        startY = Number(display[`${kind}OffsetY`]) || 0;

        try {
            textGroup.setPointerCapture(event.pointerId);
        } catch {}

    });

    textGroup.addEventListener("pointermove", event => {

        if (!dragging || !startPoint) {
            return;
        }

        const point = svgPointFromEvent(event);
        const display = station.display;

        display[`${kind}OffsetX`] = startX + point.x - startPoint.x;
        display[`${kind}OffsetY`] = startY + point.y - startPoint.y;

        renderMap();

    });

    textGroup.addEventListener("pointerup", event => {

        if (!dragging) {
            return;
        }

        dragging = false;
        startPoint = null;

        try {
            textGroup.releasePointerCapture(event.pointerId);
        } catch {}

    });

}


function drawStationText(group, station) {

    const display = station.display || {};
    const box = getStationBoxSize(station);
    const centerX = station.x;
    const centerY = station.y;
    const largeStation = getStationStopCount(station.id) >= 2;
    const name = station.name || "";
    const roman = station.roman || "";

    if (largeStation) {

        if (name) {

            const nameGroup = createSvgElement("g", {
                transform: `translate(${display.nameOffsetX || 0} ${display.nameOffsetY || 0}) rotate(${display.nameRotation || 0} ${centerX} ${centerY})`
            });

            const nameText = createSvgElement("text", {
                x: centerX,
                y: centerY - Math.max(12, display.nameSize),
                "font-size": display.nameSize,
                "text-anchor": "middle",
                "dominant-baseline": "middle"
            });

            nameText.textContent = name;
            nameGroup.appendChild(nameText);
            group.appendChild(nameGroup);
            makeDraggableText(nameGroup, station, "name");

        }

        if (roman) {

            const romanGroup = createSvgElement("g", {
                transform: `translate(${display.romanOffsetX || 0} ${display.romanOffsetY || 0}) rotate(${display.romanRotation || 0} ${centerX} ${centerY})`
            });

            const romanText = createSvgElement("text", {
                x: centerX,
                y: centerY + Math.max(12, display.romanSize),
                "font-size": display.romanSize,
                "text-anchor": "middle",
                "dominant-baseline": "middle"
            });

            romanText.textContent = roman;
            romanGroup.appendChild(romanText);
            group.appendChild(romanGroup);
            makeDraggableText(romanGroup, station, "roman");

        }

        return;

    }

    if (name) {

        const nameGroup = createSvgElement("g", {
            transform: `translate(${display.nameOffsetX || 0} ${display.nameOffsetY || 0}) rotate(${display.nameRotation || 0} ${centerX} ${centerY})`
        });

        const nameText = createSvgElement("text", {
            x: centerX,
            y: centerY + 28,
            "font-size": display.nameSize,
            "text-anchor": "middle",
            "dominant-baseline": "hanging"
        });

        nameText.textContent = name;
        nameGroup.appendChild(nameText);
        group.appendChild(nameGroup);
        makeDraggableText(nameGroup, station, "name");

    }

    if (roman) {

        const romanGroup = createSvgElement("g", {
            transform: `translate(${display.romanOffsetX || 0} ${display.romanOffsetY || 0}) rotate(${display.romanRotation || 0} ${centerX} ${centerY})`
        });

        if (display.romanDirection === "vertical") {

            const chars = [...roman];
            let y = centerY + 28;

            for (const char of chars) {

                const text = createSvgElement("text", {
                    x: centerX + box.width / 2 + 12,
                    y,
                    "font-size": display.romanSize,
                    "text-anchor": "middle",
                    "dominant-baseline": "middle"
                });

                text.textContent = char;
                romanGroup.appendChild(text);
                y += display.romanSize * 1.1;

            }

        } else {

            const text = createSvgElement("text", {
                x: centerX,
                y: centerY + box.height / 2 + display.romanSize + 8,
                "font-size": display.romanSize,
                "text-anchor": "middle",
                "dominant-baseline": "middle"
            });

            text.textContent = roman;
            romanGroup.appendChild(text);

        }

        group.appendChild(romanGroup);
        makeDraggableText(romanGroup, station, "roman");

    }

}

/* =========================================================
   TRAIN TYPE STOP CHECK
========================================================= */

function trainTypeStopsAt(
    line,
    trainTypeId,
    stationId
) {

    const setting =
        line.trainTypes.find(
            item =>
                item.trainTypeId ===
                trainTypeId
        );

    if (!setting) {
        return false;
    }

    return setting.stationIds
        .includes(stationId);

}


/* =========================================================
   DRAW LINES
========================================================= */

function renderTrainTypeLine(
    line,
    trainType
) {

    const setting =
        line.trainTypes.find(
            item =>
                item.trainTypeId ===
                trainType.id
        );


    if (!setting) {
        return;
    }


    const stationIds =
        setting.stationIds || [];


    const stations =
        stationIds
            .map(getStation)
            .filter(Boolean)
            .filter(
                station =>
                    station.visible
            );


    if (
        stations.length === 0
    ) {
        return;
    }


    const first =
        stations[0];

    const last =
        stations[
            stations.length - 1
        ];


    const lineLength =
        Number(
            trainType.lineLength
        ) || 1000;


    const offset =
        Number(
            trainType.lineOffset
        ) || 0;


    const width =
        Number(
            trainType.lineWidth
        ) || 5;


    /*
       種別ごとに独立した線を作る。
       駅間は実際の駅位置を使用する。
    */


    const points = [];


    const firstX =
        first.x -
        lineLength / 2;


    const lastX =
        first.x +
        lineLength / 2;


    for (
        const station
        of stations
    ) {

        points.push({
            x: station.x,
            y:
                station.y +
                offset
        });

    }


    /*
       駅間は各駅を直接結ぶ直線だけを描画する。
       旧データの segments は表示に使用しない。
    */

    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {

        const a = points[i];

        const b = points[i + 1];


        const segment =
            createSvgElement(
                "line",
                {
                    x1: a.x,
                    y1: a.y,
                    x2: b.x,
                    y2: b.y,
                    stroke:
                        trainType.color,
                    "stroke-width":
                        width,
                    "stroke-linecap":
                        "round"
                }
            );


        lineLayer.appendChild(
            segment
        );

    }


    /*
       種別の線の始端・終端を
       個別の長さ設定に合わせる
    */

    const startLine =
        createSvgElement(
            "line",
            {
                x1:
                    first.x -
                    lineLength / 2,
                y1:
                    first.y +
                    offset,
                x2:
                    first.x,
                y2:
                    first.y +
                    offset,
                stroke:
                    trainType.color,
                "stroke-width":
                    width,
                "stroke-linecap":
                    "round"
            }
        );


    const endLine =
        createSvgElement(
            "line",
            {
                x1:
                    last.x,
                y1:
                    last.y +
                    offset,
                x2:
                    last.x +
                    lineLength / 2,
                y2:
                    last.y +
                    offset,
                stroke:
                    trainType.color,
                "stroke-width":
                    width,
                "stroke-linecap":
                    "round"
            }
        );


    lineLayer.appendChild(
        startLine
    );

    lineLayer.appendChild(
        endLine
    );


    /*
       1種別だけ停車する駅は
       「線が途切れる」ようにする。
    */

    for (
        const station
        of stations
    ) {

        const stopCount =
            line.trainTypes.filter(
                typeSetting =>
                    typeSetting.stationIds
                        ?.includes(
                            station.id
                        )
            ).length;


        if (stopCount === 1 && getStationStopCount(station.id) < 2) {

            const radius = 8;

            const gap = 5;


            const left =
                createSvgElement(
                    "line",
                    {
                        x1:
                            station.x -
                            radius -
                            gap -
                            20,
                        y1:
                            station.y +
                            offset,
                        x2:
                            station.x -
                            radius -
                            gap,
                        y2:
                            station.y +
                            offset,
                        stroke:
                            trainType.color,
                        "stroke-width":
                            width
                    }
                );


            const right =
                createSvgElement(
                    "line",
                    {
                        x1:
                            station.x +
                            radius +
                            gap,
                        y1:
                            station.y +
                            offset,
                        x2:
                            station.x +
                            radius +
                            gap +
                            20,
                        y2:
                            station.y +
                            offset,
                        stroke:
                            trainType.color,
                        "stroke-width":
                            width
                    }
                );


            lineLayer.appendChild(
                left
            );

            lineLayer.appendChild(
                right
            );

        }

    }

}


/* =========================================================
   DRAW STATIONS
========================================================= */

function renderStation(
    station
) {

    if (!station.visible) {
        return;
    }


    const group =
        createSvgElement(
            "g",
            {
                class:
                    "station-node"
            }
        );


    group.dataset.stationId =
        station.id;


    const box =
        getStationBoxSize(station);


    const stationCount = getStationStopCount(station.id);


    /*
       複数種別停車駅
       → 大きな駅BOX
    */

    if (stationCount >= 2) {

        const rect =
            createSvgElement(
                "rect",
                {
                    x:
                        station.x -
                        box.width / 2,
                    y:
                        station.y -
                        box.height / 2,
                    width:
                        box.width,
                    height:
                        box.height,
                    rx: 4,
                    ry: 4,
                    fill:
                        "white",
                    stroke:
                        "#111",
                    "stroke-width":
                        4
                }
            );


        group.appendChild(
            rect
        );

    } else {

        /*
           1種別だけなら円形駅
        */

        const circle =
            createSvgElement(
                "circle",
                {
                    cx:
                        station.x,
                    cy:
                        station.y,
                    r: 10,
                    fill:
                        "white",
                    stroke:
                        "#111",
                    "stroke-width":
                        4
                }
            );


        group.appendChild(
            circle
        );

    }


    drawStationText(
        group,
        station
    );


    /*
       乗換案内
    */

    if (
        station.transfers &&
        station.transfers.length
    ) {

        const transferText =
            station.transfers.join(
                " / "
            );


        const text =
            createSvgElement(
                "text",
                {
                    x:
                        station.x +
                        box.width / 2 +
                        8,
                    y:
                        station.y,
                    "font-size":
                        10,
                    "text-anchor":
                        "start"
                }
            );


        text.textContent =
            transferText;


        group.appendChild(
            text
        );

    }


    /*
       ドラッグ
    */

    group.addEventListener(
        "pointerdown",
        event => {

            event.stopPropagation();

            state.selectedStationId =
                station.id;

            if (!state.dragMode) {
                openStationModal(
                    station.id
                );
                return;
            }


            const point =
                svgPointFromEvent(
                    event
                );


            state.draggingStation =
                station;


            state.dragOffsetX =
                station.x -
                point.x;


            state.dragOffsetY =
                station.y -
                point.y;


            group.setPointerCapture(
                event.pointerId
            );

        }
    );


    group.addEventListener(
        "pointermove",
        event => {

            if (
                state.draggingStation !==
                station
            ) {
                return;
            }


            const point =
                svgPointFromEvent(
                    event
                );


            station.x =
                clamp(
                    point.x +
                    state.dragOffsetX,
                    20,
                    1580
                );


            station.y =
                clamp(
                    point.y +
                    state.dragOffsetY,
                    20,
                    980
                );


            renderMap();

        }
    );


    group.addEventListener(
        "pointerup",
        event => {

            if (
                state.draggingStation ===
                station
            ) {

                state.draggingStation =
                    null;

                try {

                    group.releasePointerCapture(
                        event.pointerId
                    );

                } catch {}

            }

        }
    );


    group.addEventListener(
        "dblclick",
        event => {

            event.stopPropagation();

            openStationModal(
                station.id
            );

        }
    );


    stationLayer.appendChild(
        group
    );

}


/* =========================================================
   MAP SIZE
========================================================= */

function updateMapViewportSize() {

    const maxX = state.map.stations.reduce(
        (max, station) => Math.max(max, Number(station.x) || 0),
        100
    );

    const width = Math.max(1600, maxX + 300);

    svg.setAttribute(
        "viewBox",
        `0 0 ${width} 1000`
    );

    $("mapBackground").setAttribute("width", width);
    $("mapGrid").setAttribute("width", width);

}


/* =========================================================
   RENDER MAP
========================================================= */

function renderMap() {

    normalizeMap();
    updateMapViewportSize();


    stationLayer.innerHTML = "";

    lineLayer.innerHTML = "";

    breakLayer.innerHTML = "";

    selectionLayer.innerHTML = "";


    /*
       先に線
    */

    for (
        const line
        of state.map.lines
    ) {

        for (
            const type
            of state.map.trainTypes
        ) {

            renderTrainTypeLine(
                line,
                type
            );

        }

    }


    /*
       区切り・折れ曲がり
    */

    renderBreaks();


    /*
       最後に駅BOX
    */

    for (
        const station
        of state.map.stations
    ) {

        renderStation(
            station
        );

    }


    updateLists();

}


/* =========================================================
   BREAKS
========================================================= */

function renderBreaks() {

    for (
        const item
        of state.map.breaks
    ) {

        if (
            !item.points ||
            item.points.length < 2
        ) {
            continue;
        }


        const points =
            item.points
                .map(
                    point =>
                        `${point.x},${point.y}`
                )
                .join(" ");


        const polyline =
            createSvgElement(
                "polyline",
                {
                    points,
                    fill:
                        "none",
                    stroke:
                        "#333",
                    "stroke-width":
                        3,
                    "stroke-dasharray":
                        "8 8"
                }
            );


        breakLayer.appendChild(
            polyline
        );

    }

}


/* =========================================================
   STATION LIST
========================================================= */

function updateStationList() {

    const container =
        $("stationList");

    container.innerHTML = "";


    for (
        const station
        of state.map.stations
    ) {

            document.createElement(
                "div"
            );


        row.className =
            "editor-list-item";


        row.innerHTML = `

            <div class="list-main">

                <strong>
                    ${escapeHtml(
                        station.name ||
                        "名称未設定"
                    )}
                </strong>

                <small>
                    ${escapeHtml(
                        station.roman ||
                        ""
                    )}
                </small>

            </div>

            <div class="list-actions">

                <button
                    class="small-button"
                    data-action="visibility"
                >
                    ${
                        station.visible
                            ? "表示"
                            : "非表示"
                    }
                </button>

                <button
                    class="small-button"
                    data-action="edit"
                >
                    詳細
                </button>

                <button
                    class="danger-small-button"
                    data-action="delete"
                >
                    削除
                </button>

            </div>
        `;


        row.querySelector(
            '[data-action="visibility"]'
        ).addEventListener(
            "click",
            () => {

                station.visible =
                    !station.visible;

                renderMap();

            }
        );


        row.querySelector(
            '[data-action="edit"]'
        ).addEventListener(
            "click",
            () => {

                openStationModal(
                    station.id
                );

            }
        );


        row.querySelector(
            '[data-action="delete"]'
        ).addEventListener(
            "click",
            () => {

                if (
                    !confirm(
                        "この駅を削除しますか？"
                    )
                ) {
                    return;
                }


                state.map.stations =
                    state.map.stations.filter(
                        item =>
                            item.id !==
                            station.id
                    );


                for (
                    const line
                    of state.map.lines
                ) {

                    line.stationIds =
                        line.stationIds.filter(
                            id =>
                                id !==
                                station.id
                        );


                    for (
                        const setting
                        of line.trainTypes
                    ) {

                        setting.stationIds =
                            setting.stationIds
                                .filter(
                                    id =>
                                        id !==
                                        station.id
                                );

                    }

                }


                renderMap();

            }
        );


        container.appendChild(
            row
        );

    }

}

/* =========================================================

========================================================= */

function updateLineStationEditor() {

    const container =
        $("lineStationEditor");

    container.innerHTML = "";


    const line =
        getLine(
            state.selectedLineId
        );


    const type =
        getTrainType(
            state.selectedTrainTypeId
        );


    if (!line) {

        container.textContent =
            "路線を選択してください。";

        return;

    }


    /*
       路線への駅追加
    */

    const title =
        document.createElement(
            "h4"
        );

    title.textContent =
        "路線に駅を追加";

    container.appendChild(
        title
    );


    for (
        const station
        of state.map.stations
    ) {

        const label =
            document.createElement(
                "label"
            );


        label.className =
            "checkbox-row";


        const checkbox =
            document.createElement(
                "input"
            );


        checkbox.type =
            "checkbox";

        checkbox.checked =
            line.stationIds
                .includes(
                    station.id
                );


        checkbox.addEventListener(
            "change",
            () => {

                if (
                    checkbox.checked
                ) {

                    if (
                        !line.stationIds
                            .includes(
                                station.id
                            )
                    ) {

                        line.stationIds.push(
                            station.id
                        );

                    }

                } else {

                    line.stationIds =
                        line.stationIds.filter(
                            id =>
                                id !==
                                station.id
                        );


                    for (
                        const setting
                        of line.trainTypes
                    ) {

                        setting.stationIds =
                            setting.stationIds
                                .filter(
                                    id =>
                                        id !==
                                        station.id
                                );

                    }

                }


                renderMap();

            }
        );


        label.appendChild(
            checkbox
        );


        const span =
            document.createElement(
                "span"
            );

        span.textContent =
            station.name;

        label.appendChild(
            span
        );


        container.appendChild(
            label
        );

    }


    /*
       選択中の種別に停車駅を設定
    */

    if (!type) {
        return;
    }


    const title2 =
        document.createElement(
            "h4"
        );

    title2.textContent =
        `${type.name} の停車駅`;

    container.appendChild(
        title2
    );


    let setting =
        line.trainTypes.find(
            item =>
                item.trainTypeId ===
                type.id
        );


    if (!setting) {

        setting = {

            trainTypeId:
                type.id,

            stationIds: []

        };


        line.trainTypes.push(
            setting
        );

    }


    for (
        const stationId
        of line.stationIds
    ) {

        const station =
            getStation(
                stationId
            );


        if (!station) {
            continue;
        }


        const label =
            document.createElement(
                "label"
            );


        label.className =
            "checkbox-row";


        const checkbox =
            document.createElement(
                "input"
            );


        checkbox.type =
            "checkbox";


        checkbox.checked =
            setting.stationIds
                .includes(
                    station.id
                );


        checkbox.addEventListener(
            "change",
            () => {

                if (
                    checkbox.checked
                ) {

                    if (
                        !setting.stationIds
                            .includes(
                                station.id
                            )
                    ) {

                        setting.stationIds.push(
                            station.id
                        );

                    }

                } else {

                    setting.stationIds =
                        setting.stationIds.filter(
                            id =>
                                id !==
                                station.id
                        );

                }


                renderMap();

            }
        );


        label.appendChild(
            checkbox
        );


        const span =
            document.createElement(
                "span"
            );

        span.textContent =
            station.name;

        label.appendChild(
            span
        );


        container.appendChild(
            label
        );

    }

}

function renderLineModalStations(line) {

    const container = $("lineStationChecklist");
    container.innerHTML = "";

    for (const station of state.map.stations) {

        const wrapper = document.createElement("div");
        wrapper.className = "line-station-item";

        const label = document.createElement("label");
        label.className = "checkbox-row";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = line.stationIds.includes(station.id);

        checkbox.addEventListener("change", () => {

            if (checkbox.checked) {

                if (!line.stationIds.includes(station.id)) {
                    line.stationIds.push(station.id);
                }

            } else {

                line.stationIds = line.stationIds.filter(id => id !== station.id);

                for (const setting of line.trainTypes || []) {
                    setting.stationIds = (setting.stationIds || []).filter(id => id !== station.id);
                }

            }

            renderLineModalStations(line);
            renderMap();

        });

        label.appendChild(checkbox);

        const span = document.createElement("span");
        span.textContent = station.name;
        label.appendChild(span);
        wrapper.appendChild(label);

        if (checkbox.checked) {

            const stopSettings = document.createElement("div");
            stopSettings.className = "station-stop-settings";

            const stopTitle = document.createElement("small");
            stopTitle.textContent = "停車駅設定";
            stopSettings.appendChild(stopTitle);

            for (const type of state.map.trainTypes) {

                const setting = line.trainTypes.find(item => item.trainTypeId === type.id);

                const stopLabel = document.createElement("label");
                stopLabel.className = "checkbox-row";

                const stopCheckbox = document.createElement("input");
                stopCheckbox.type = "checkbox";
                stopCheckbox.checked = Boolean(setting?.stationIds?.includes(station.id));

                stopCheckbox.addEventListener("change", () => {

                    let current = line.trainTypes.find(item => item.trainTypeId === type.id);

                    if (!current && stopCheckbox.checked) {
                        current = {trainTypeId: type.id, stationIds: []};
                        line.trainTypes.push(current);
                    }

                    if (!current) {
                        return;
                    }

                    if (stopCheckbox.checked) {
                        if (!current.stationIds.includes(station.id)) {
                            current.stationIds.push(station.id);
                        }
                    } else {
                        current.stationIds = current.stationIds.filter(id => id !== station.id);
                    }

                    renderLineModalStations(line);
                    renderMap();

                });

                stopLabel.appendChild(stopCheckbox);

                const typeName = document.createElement("span");
                typeName.textContent = type.name;
                typeName.style.borderLeft = `5px solid ${type.color}`;
                typeName.style.paddingLeft = "8px";
                stopLabel.appendChild(typeName);

                stopSettings.appendChild(stopLabel);

            }

            wrapper.appendChild(stopSettings);

        }

        container.appendChild(wrapper);

    }

}

function renderLineModalTrainTypes(
    line
) {

    const container =
        $("lineTrainTypeSettings");

    container.innerHTML = "";


    for (
        const type
        of state.map.trainTypes
    ) {

        let setting =
            line.trainTypes.find(
                item =>
                    item.trainTypeId ===
                    type.id
            );


        const label =
            document.createElement(
                "label"
            );

        label.className =
            "checkbox-row";


        const checkbox =
            document.createElement(
                "input"
            );

        checkbox.type =
            "checkbox";

        checkbox.checked =
            Boolean(setting);


        checkbox.addEventListener(
            "change",
            () => {

                if (
                    checkbox.checked
                ) {

                    if (!setting) {

                        line.trainTypes.push({

                            trainTypeId:
                                type.id,

                            stationIds: []

                        });

                    }

                } else {

                    line.trainTypes =
                        line.trainTypes.filter(
                            item =>
                                item.trainTypeId !==
                                type.id
                        );

                }


                renderLineModalTrainStations(
                    line
                );

                renderMap();

            }
        );


        label.appendChild(
            checkbox
        );


        const span =
            document.createElement(
                "span"
            );

        span.textContent =
            type.name;

        span.style.borderLeft =
            `5px solid ${type.color}`;

        span.style.paddingLeft =
            "8px";


        label.appendChild(
            span
        );


        container.appendChild(

        );
